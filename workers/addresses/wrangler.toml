name = "reimagined-octo-meme"
# Cloudflare Git builds use workers/addresses as root — shared code lives in ./shared/
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Dashboard had WORKER_SELF_REFERENCE pointing at missing worker "my-airport-taxi-ni"
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "reimagined-octo-meme"

[observability]
enabled = true
