name = "reimagined-octo-meme"
# Cloudflare Git builds use workers/addresses as root — shared code lives in ./shared/
main = "src/index.ts"
compatibility_date = "2025-08-01"
# Secrets (set in Cloudflare dashboard, setup-worker.mjs, or wrangler secret put):
# - GOOGLE_PLACES_API_KEY
# - IDEAL_POSTCODES_API_KEY  (UK/NI postcode → premises list; preferred over getAddress)
# - GETADDRESS_API_KEY       (legacy; getAddress.io shut down Feb 2026)
# - AERODATABOX_RAPIDAPI_KEY  (RapidAPI key for AeroDataBox flight verification)
# - WEB3FORMS_ACCESS_KEY
# - RESEND_API_KEY           (preferred branded HTML invoices — never expose to the browser)
# - SUMUP_API_KEY / SUMUP_MERCHANT_CODE  (hosted checkout — Worker-only secrets)
# - WHATSAPP_BOOKING_ENABLED=true + META_WHATSAPP_VERIFY_TOKEN / APP_SECRET /
#   ACCESS_TOKEN / PHONE_NUMBER_ID  (WhatsApp Cloud API booking — Worker-only)
# - GOOGLE_REVIEW_URL  (Google Business "Write a review" link for post-trip emails)
# - OWNER_ACCESS_KEY   (optional — defaults to DRIVER_ACCESS_KEY for /admin/refund/)
# Redeploy after changing worker code: wrangler deploy (or Cloudflare dashboard → Deploy)
account_id = "36c5c88df4c1f0259413d555f2679f3c"

[build]
command = "node ../../scripts/sync-worker-shared.mjs && npm run typecheck"

[observability]
enabled = true

# Booking reference counter (MATNI-1001+). Run `npm run setup:worker` to create the
# BOOKING_COUNTER KV namespace and add the [[kv_namespaces]] block here automatically.
# Until then, bookings work without sequential references.

[[kv_namespaces]]
binding = "TRACKING_STORE"
id = "53fa3cc2bd46436f90ae19200e599ea1"

[[kv_namespaces]]
binding = "BOOKING_COUNTER"
id = "869e2c2e02004d4a88c9cfbf563f1d6a"
#
# Live driver tracking (paid bookings). setup-worker.mjs creates TRACKING_STORE KV and
# sets DRIVER_ACCESS_KEY secret for the /driver/ dashboard.
# Optional: TRACKING_GPS_HISTORY_TTL_SECONDS (plain var) — GPS audit retention override (seconds, min 30 days).
# Default GPS history retention is ~400 days.

# Cloudflare Email Service (optional — onboard myairporttaxini.co.uk in dashboard first).
# Without this, bookings email via WEB3FORMS_ACCESS_KEY secret, then MailChannels.
# Set WEB3FORMS_ACCESS_KEY in GitHub Actions secrets — deploy-worker syncs it automatically.
[[send_email]]
name = "EMAIL"

[vars]
# Minutes after journey COMPLETE before automated Google review email (hourly cron sends when due).
REVIEW_REQUEST_DELAY_MINUTES = "120"

[triggers]
crons = ["0 * * * *"]
