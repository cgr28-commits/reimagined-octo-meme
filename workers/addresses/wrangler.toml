name = "reimagined-octo-meme"
# Cloudflare Git builds use workers/addresses as root — shared code lives in ./shared/
main = "src/index.ts"
compatibility_date = "2025-07-31"
# Secrets (set in Cloudflare dashboard or via wrangler secret put):
# - GOOGLE_PLACES_API_KEY
# - GETADDRESS_API_KEY
# - AERODATABOX_RAPIDAPI_KEY  (RapidAPI key for AeroDataBox flight verification)
account_id = "36c5c88df4c1f0259413d555f2679f3c"

[observability]
enabled = true

# Create in Cloudflare dashboard (Workers & Pages → KV), then paste the namespace id below.
[[kv_namespaces]]
binding = "BOOKING_COUNTER"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
