name = "reimagined-octo-meme"
main = "src/index.ts"
compatibility_date = "2025-08-01"

# Local demo only — not used for production deploy.
[[kv_namespaces]]
binding = "TRACKING_STORE"
id = "local-tracking-demo-store"

[[durable_objects.bindings]]
name = "REFUND_COORDINATOR"
class_name = "RefundCoordinator"

[[durable_objects.bindings]]
name = "DRIVER_LOCATOR"
class_name = "DriverLocator"

[[migrations]]
tag = "v1-refund-coordinator"
new_sqlite_classes = ["RefundCoordinator"]

[[migrations]]
tag = "v5-driver-locator"
new_sqlite_classes = ["DriverLocator"]

[vars]
DRIVER_ACCESS_KEY = "demo-driver-key"
GOOGLE_PLACES_API_KEY = "local-demo"
# Local demo only: lets the owner key test Find Your Driver with wrangler dev.
DRIVER_LOCATOR_MODE = "owner-test"
