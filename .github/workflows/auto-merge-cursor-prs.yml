name: Auto-merge Cursor PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.draft == false && startsWith(github.head_ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge when checks pass
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || pr.draft || !pr.head.ref.startsWith("cursor/")) {
              return;
            }

            const { data: prDetails } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            if (prDetails.merged || !prDetails.mergeable) {
              return;
            }

            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: prDetails.head.sha,
            });

            const runs = checks.check_runs.filter((run) => run.name !== "Auto-merge Cursor PRs");
            if (runs.length === 0) {
              return;
            }

            const allSuccess = runs.every(
              (run) => run.status === "completed" && run.conclusion === "success",
            );

            if (!allSuccess) {
              return;
            }

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: "merge",
            });
