name: Auto-merge Cursor PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  check_suite:
    types: [completed]
  status: {}

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  automerge:
    # Always auto-merge Cursor agent branches once checks pass (drafts are undrafted first).
    if: >
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'cursor/')) ||
      github.event_name == 'check_suite' ||
      github.event_name == 'status'
    runs-on: ubuntu-latest
    steps:
      - name: Merge when checks pass
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function findCursorPulls() {
              const pulls = [];

              if (context.payload.pull_request?.head?.ref?.startsWith("cursor/")) {
                pulls.push(context.payload.pull_request);
                return pulls;
              }

              const headSha =
                context.payload.check_suite?.head_sha ||
                context.payload.sha ||
                null;

              if (headSha) {
                const { data } = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: "open",
                  per_page: 50,
                });
                for (const pr of data) {
                  if (pr.head.ref.startsWith("cursor/") && pr.head.sha === headSha) {
                    pulls.push(pr);
                  }
                }
                return pulls;
              }

              return pulls;
            }

            const candidates = await findCursorPulls();
            if (candidates.length === 0) {
              return;
            }

            for (const candidate of candidates) {
              const pull_number = candidate.number;

              let { data: prDetails } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number,
              });

              if (prDetails.merged || !prDetails.head.ref.startsWith("cursor/")) {
                continue;
              }

              // GitHub cannot merge draft PRs — mark ready first.
              if (prDetails.draft) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number,
                  draft: false,
                });
                ({ data: prDetails } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number,
                }));
              }

              if (prDetails.mergeable !== true) {
                continue;
              }

              const { data: checks } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: prDetails.head.sha,
              });

              const ignored = new Set(["Auto-merge Cursor PRs", "automerge"]);
              const runs = checks.check_runs.filter((run) => !ignored.has(run.name));

              const blockingRuns = runs.filter(
                (run) =>
                  run.status !== "completed" ||
                  (run.conclusion &&
                    !["success", "skipped", "neutral", "stale"].includes(run.conclusion)),
              );
              if (blockingRuns.length > 0) {
                continue;
              }

              // Also honour commit status contexts (e.g. Vercel).
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: prDetails.head.sha,
              });
              if (combined.state === "pending" || combined.state === "failure") {
                continue;
              }

              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number,
                merge_method: "merge",
              });
            }
