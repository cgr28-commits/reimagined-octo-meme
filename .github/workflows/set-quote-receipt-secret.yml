name: Set quote receipt secret

# One-off: create QUOTE_RECEIPT_SECRET on the production Worker if it is missing.
# Does not deploy and does not print the secret value.
on:
  workflow_dispatch:

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/addresses/package-lock.json

      - name: Create QUOTE_RECEIPT_SECRET if missing
        working-directory: workers/addresses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing Cloudflare credentials"
            exit 1
          fi
          npm ci
          has_secret() {
            printf '%s' "$1" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const rows=JSON.parse(s); if(!Array.isArray(rows)) process.exit(2); process.exit(rows.some(r=>r&&r.name==="QUOTE_RECEIPT_SECRET")?0:1)})'
          }
          list="$(npx wrangler secret list)"
          if has_secret "$list"; then
            echo "QUOTE_RECEIPT_SECRET already present. Not replaced."
            exit 0
          fi
          openssl rand -base64 32 | tr -d '\n' | npx wrangler secret put QUOTE_RECEIPT_SECRET
          after="$(npx wrangler secret list)"
          if ! has_secret "$after"; then
            echo "::error::QUOTE_RECEIPT_SECRET was not created"
            exit 1
          fi
          echo "QUOTE_RECEIPT_SECRET created."
