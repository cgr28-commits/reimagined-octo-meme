name: fetch-image-proposals
# Preview-only: downloads licensed candidate photos for the owner's review.
# Lives on the orphan image-proposals branch; never deploys anything.
on:
  push:
    branches: [image-proposals]
    paths: [manifest.json, .github/workflows/fetch-image-proposals.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download candidates
        run: |
          mkdir -p candidates
          python3 - <<'PY'
          import json, urllib.request, os, time
          ua = {"User-Agent": "MyAirportTaxiNI-image-review/1.0 (website image licensing review)"}
          for m in json.load(open("manifest.json")):
              out = f"candidates/{m['id']}.jpg"
              if os.path.exists(out): continue
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(m["url"], headers=ua), timeout=60) as r:
                          open(out, "wb").write(r.read())
                      print("ok", m["id"], os.path.getsize(out)); break
                  except Exception as e:
                      print("retry", m["id"], e); time.sleep(5)
              time.sleep(1)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add candidates
          git diff --cached --quiet || git commit -m "Add downloaded image candidates for review [skip ci]"
          git push
