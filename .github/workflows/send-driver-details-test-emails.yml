name: Send driver/customer test emails

on:
  push:
    branches:
      - "cursor/owner-driver-details-514b"
    paths:
      - "scripts/send-driver-details-test-emails.ts"
      - "shared/booking-job.ts"
      - "workers/addresses/**"
      - "workers/test-mailer/**"
      - ".github/workflows/send-driver-details-test-emails.yml"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install repo dependencies
        run: npm ci

      - name: Build email payloads
        env:
          EMAIL_PREVIEW_DIR: artifacts/email-previews
          SKIP_SEND: "1"
        run: npx tsx scripts/send-driver-details-test-emails.ts

      - name: Sync + build + deploy production worker
        working-directory: workers/addresses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID required"
            exit 1
          fi
          npm ci
          npm run build
          npx wrangler deploy

      - name: Send both test emails via production worker
        env:
          OWNER_ACCESS_KEY: ${{ secrets.OWNER_ACCESS_KEY }}
        run: |
          if [ -z "$OWNER_ACCESS_KEY" ]; then
            echo "::error::OWNER_ACCESS_KEY secret required"
            exit 1
          fi
          # brief settle after deploy
          sleep 5
          RESPONSE=$(curl -sS -X POST \
            "https://reimagined-octo-meme.cgr28.workers.dev/test/driver-detail-emails" \
            -H "Content-Type: application/json" \
            -H "X-Owner-Key: $OWNER_ACCESS_KEY" \
            -d '{"to":"cgr28@hotmail.co.uk"}')
          echo "$RESPONSE"
          echo "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const j=JSON.parse(s); if(!j.ok){console.error(j); process.exit(1)} console.log("sent ok", j.to)})'

      - name: Upload email HTML previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-customer-email-previews
          path: artifacts/email-previews
