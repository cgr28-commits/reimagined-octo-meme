name: Send driver/customer test emails

on:
  push:
    branches:
      - "cursor/owner-driver-details-514b"
    paths:
      - ".github/workflows/send-driver-details-test-emails.yml"
      - "workers/addresses/src/test-email-handlers.ts"
      - "scripts/send-driver-details-test-emails.ts"
      - "shared/booking-job.ts"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install repo dependencies
        run: npm ci

      - name: Build email payloads
        env:
          EMAIL_PREVIEW_DIR: artifacts/email-previews
          SKIP_SEND: "1"
        run: npx tsx scripts/send-driver-details-test-emails.ts

      - name: Deploy worker + one-shot test token
        id: deploy
        working-directory: workers/addresses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE credentials required"
            exit 1
          fi
          npm ci
          npm run build
          npx wrangler deploy
          TOKEN=$(openssl rand -hex 24)
          printf '%s' "$TOKEN" | npx wrangler secret put TEST_EMAIL_TOKEN
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Send test emails to hotmail + bookings inbox
        env:
          TEST_EMAIL_TOKEN: ${{ steps.deploy.outputs.token }}
        run: |
          sleep 10
          ok=0
          for to in "cgr28@hotmail.co.uk" "bookings@myairporttaxini.co.uk"; do
            echo "=== Sending to $to ==="
            RESPONSE=$(curl -sS -X POST \
              "https://reimagined-octo-meme.cgr28.workers.dev/test/driver-detail-emails" \
              -H "Content-Type: application/json" \
              -H "X-Test-Email-Token: $TEST_EMAIL_TOKEN" \
              -d "{\"to\":\"$to\"}")
            echo "$RESPONSE"
            if echo "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{process.exit(JSON.parse(s).ok?0:1)}catch{process.exit(1)}})'; then
              echo "OK $to"
              ok=1
            else
              echo "FAIL $to"
            fi
          done
          if [ "$ok" != "1" ]; then
            exit 1
          fi

      - name: Clear one-shot test token
        if: always()
        working-directory: workers/addresses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf 'cleared' | npx wrangler secret put TEST_EMAIL_TOKEN || true

      - name: Upload email HTML previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-customer-email-previews
          path: artifacts/email-previews
