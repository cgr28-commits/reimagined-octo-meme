name: Compact cookie banner review
on:
  push:
    branches: [codex/compact-cookie-banner]
  pull_request:
    branches: [main]
    paths:
      - src/components/CookieConsent.tsx
      - src/app/globals.css
      - scripts/check-cookie-banner-browser.mjs
      - .github/workflows/cookie-banner-review.yml
permissions:
  contents: read
concurrency:
  group: cookie-banner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-browser-review:
    runs-on: ubuntu-24.04
    # Baseline+candidate builds plus Playwright install can stall past 25m.
    timeout-minutes: 40
    env:
      GITHUB_PAGES: 'true'
      NEXT_PUBLIC_ADDRESSES_API_URL: http://127.0.0.1:3198/isolated-api/addresses
      NEXT_PUBLIC_BOOKINGS_API_URL: http://127.0.0.1:3198/isolated-api/bookings
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: ed67b1f85debc674eed0fe71a3a8ee6ccbed9dad
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Build unchanged main baseline
        working-directory: baseline
        run: |
          # next/font Google fetch is intermittently null in CI; retry the build.
          for attempt in 1 2 3; do
            npm ci && npm run build && exit 0
            echo "baseline build attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
      - name: Build candidate and check consent code
        working-directory: candidate
        run: |
          npm ci
          npm run lint
          npm run check:google-ads
          npm run check:conversion-tracking
          for attempt in 1 2 3; do
            npm run build && exit 0
            echo "candidate build attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
      - name: Install test browsers
        working-directory: candidate
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Compare banner, consent and unchanged page at five widths
        working-directory: candidate
        run: BASELINE_OUT=../baseline/out node scripts/check-cookie-banner-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookie-banner-before-after
          path: candidate/test-results/cookie-banner/
          retention-days: 14
