# Daily: sample 100 routes vs OTS, auto-adjust airport surcharges, commit to main.

name: OTS daily pricing check

on:
  schedule:
    # 06:00 UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      sample_size:
        description: Number of routes to sample
        required: false
        default: "100"
      check_date:
        description: Seed date (YYYY-MM-DD) for reproducible sample
        required: false
        default: ""

permissions:
  contents: write

jobs:
  auto-calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Auto-calibrate airport pricing from live OTS quotes
        env:
          OTS_SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '100' }}
          OTS_CHECK_DATE: ${{ github.event.inputs.check_date || '' }}
        run: npm run calibrate:ots-pricing

      - name: Upload calibration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ots-calibration-report-${{ github.run_id }}
          path: reports/ots-calibration-*.json
          retention-days: 30

      - name: Commit and push surcharge updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/quote.ts
          if git diff --staged --quiet; then
            echo "No pricing changes to commit"
          else
            git commit -m "chore: auto-calibrate airport pricing from daily OTS check"
            git pull --rebase origin main
            git push
          fi

      - name: Summarise calibration report
        if: always()
        run: |
          REPORT=$(ls reports/ots-calibration-*.json | head -1)
          echo "## OTS daily auto-calibration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          node -e "
            const report = require('./' + process.argv[1]);
            console.log('Routes sampled:', report.sampleSize);
            console.log('Surcharge updates applied:', report.patchesApplied.length);
            console.log('');
            for (const patch of report.patchesApplied.slice(0, 20)) {
              console.log('- ' + patch.area + ' / ' + patch.airportCode + ': ' + (patch.previous ?? '?') + ' → ' + patch.surcharge);
            }
            if (report.patchesApplied.length > 20) {
              console.log('… and ' + (report.patchesApplied.length - 20) + ' more');
            }
          " "$REPORT" >> "$GITHUB_STEP_SUMMARY"
