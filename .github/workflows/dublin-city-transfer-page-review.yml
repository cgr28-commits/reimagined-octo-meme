name: Dublin city transfer page review
on:
  pull_request:
    paths:
      - 'src/components/DublinCityTransferLanding.tsx'
      - 'src/lib/dublin-city-transfer-content.ts'
      - 'src/app/transfers/belfast-to-dublin-city/**'
      - 'scripts/check-dublin-city-transfer-page.mjs'
      - '.github/workflows/dublin-city-transfer-page-review.yml'
permissions:
  contents: read
jobs:
  page-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: GITHUB_PAGES=true npm run build
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Mobile and desktop page review
        run: |
          python3 -m http.server 3000 --directory out &
          sleep 2
          node scripts/check-dublin-city-transfer-page.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dublin-city-transfer-page-previews
          path: test-results/dublin-city-transfer-page/
