name: Compact schedule popup browser review

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/HomepageQuoteFields.tsx'
      - 'src/components/QuoteCard.tsx'
      - 'scripts/check-homepage-booking-browser.mjs'
      - 'scripts/check-homepage-quote-height-compare.mjs'
      - 'scripts/check-quote-schedule-price-gate.ts'
      - 'scripts/check-quote-checkout-page.ts'
      - 'scripts/check-quote-required-fields.ts'
      - '.github/workflows/compact-schedule-browser.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build updated quote flow
        run: GITHUB_PAGES=true npm run build
      - name: Check out main for before/after measurements
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - name: Build baseline main and serve it
        working-directory: baseline
        run: |
          npm ci
          GITHUB_PAGES=true npm run build
          python3 -m http.server 3001 --directory out > "$RUNNER_TEMP/matni-baseline-server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3001/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3001/ > /dev/null
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Schedule and checkout regression checks
        run: |
          node --import tsx scripts/check-quote-schedule-price-gate.ts
          node --import tsx scripts/check-quote-checkout-page.ts
          node --import tsx scripts/check-quote-required-fields.ts
      - name: Test popup, booking and compare card heights at five viewports
        run: |
          python3 -m http.server 3000 --directory out > "$RUNNER_TEMP/matni-updated-server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3000/ > /dev/null
          QUOTE_BASELINE_URL=http://127.0.0.1:3001 QUOTE_UPDATED_URL=http://127.0.0.1:3000 node --import tsx scripts/check-homepage-quote-height-compare.mjs
          TEST_BASE_URL=http://127.0.0.1:3000 node --import tsx scripts/check-homepage-booking-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-schedule-browser-review
          path: |
            test-results/homepage-booking/
            test-results/homepage-layout-compare/
          if-no-files-found: warn
