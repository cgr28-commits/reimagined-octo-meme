name: Prepare Cork route landmark photos
on:
  pull_request:
    paths:
      - 'scripts/prepare-cork-route-images.mjs'
      - '.github/workflows/cork-route-landmark-assets.yml'
permissions:
  contents: read
jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-cork-route-images.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cork-route-landmark-assets
          path: test-results/cork-landmarks/
