name: Sync worker address secrets

# Deploys the worker after syncing Google / Ideal Postcodes keys used by /addresses.
on:
  push:
    branches:
      - "cursor/fix-site-issues-514b"
    paths:
      - "workers/addresses/**"
      - "shared/google-places.ts"
      - "shared/getaddress.ts"
      - "shared/ideal-postcodes.ts"
      - ".github/workflows/deploy-worker.yml"
      - ".github/workflows/sync-worker-address-secrets.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/addresses/package-lock.json

      - name: Sync address secrets + deploy worker
        working-directory: workers/addresses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY || secrets.GOOGLE_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
          IDEAL_POSTCODES_API_KEY: ${{ secrets.IDEAL_POSTCODES_API_KEY }}
          GETADDRESS_API_KEY: ${{ secrets.GETADDRESS_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing Cloudflare credentials"
            exit 1
          fi
          npm ci
          npm run build
          if [ -n "$GOOGLE_PLACES_API_KEY" ]; then
            printf '%s' "$GOOGLE_PLACES_API_KEY" | npx wrangler secret put GOOGLE_PLACES_API_KEY
            echo "::notice::Synced GOOGLE_PLACES_API_KEY (${#GOOGLE_PLACES_API_KEY} chars)"
          else
            echo "::error::GOOGLE_PLACES_API_KEY / GOOGLE_API_KEY / GOOGLE_MAPS_API_KEY not set in Actions secrets"
            exit 1
          fi
          if [ -n "$IDEAL_POSTCODES_API_KEY" ]; then
            printf '%s' "$IDEAL_POSTCODES_API_KEY" | npx wrangler secret put IDEAL_POSTCODES_API_KEY
            echo "::notice::Synced IDEAL_POSTCODES_API_KEY"
          else
            echo "::warning::IDEAL_POSTCODES_API_KEY not set — postcode premises lookup unavailable"
          fi
          if [ -n "$GETADDRESS_API_KEY" ]; then
            printf '%s' "$GETADDRESS_API_KEY" | npx wrangler secret put GETADDRESS_API_KEY
            echo "::notice::Synced GETADDRESS_API_KEY"
          else
            echo "::notice::GETADDRESS_API_KEY not set (getAddress.io discontinued)"
          fi
          npx wrangler deploy
          sleep 6
          for q in "Donegall%20Place" "BT36%207FU" "Bangor"; do
            RESPONSE=$(curl -sS "https://reimagined-octo-meme.cgr28.workers.dev/addresses?q=$q&airport=BFS")
            echo "q=$q $RESPONSE"
            COUNT=$(echo "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const j=JSON.parse(s); process.stdout.write(String((j.suggestions||[]).length))})')
            if [ "$COUNT" != "0" ]; then
              echo "::notice::Address suggestions ok for $q ($COUNT) via $(echo "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(JSON.parse(s).provider||"?"))')"
              exit 0
            fi
          done
          echo "::error::Address suggestions still empty for Donegall Place / BT36 7FU / Bangor"
          exit 1
