# Isolated frontend preview for draft-PR smoke tests.
# Does NOT use the github-pages environment or production custom domain.
# Production Deploy GitHub Pages workflow + branch protection stay unchanged.
#
# Cloudflare token requirements for this workflow:
# - Account → Cloudflare Pages → Edit
# - Account → Account Settings → Read (recommended)
# - User → User Details → Read (optional; silences wrangler whoami warning)
# Prefer a dedicated secret CLOUDFLARE_PAGES_API_TOKEN so the Workers-only
# CLOUDFLARE_API_TOKEN can stay narrowly scoped. Falls back to CLOUDFLARE_API_TOKEN.
# Preview project name: my-airport-taxi-ni-preview (create once in Cloudflare if missing).

name: Deploy Pages Preview

"on":
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for this preview deploy"
        required: false
        default: "PR smoke-test preview"
  # Owner-only interactive test of draft PRs. Does not publish to the live site.
  push:
    branches:
      - cursor/customer-smart-availability-gate-514b

concurrency:
  group: pages-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview-worker:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.worker_preview.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/addresses/package-lock.json

      - name: Deploy isolated preview Worker (not production)
        id: worker_preview
        working-directory: workers/addresses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY || secrets.GOOGLE_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
          IDEAL_POSTCODES_API_KEY: ${{ secrets.IDEAL_POSTCODES_API_KEY }}
          GETADDRESS_API_KEY: ${{ secrets.GETADDRESS_API_KEY }}
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          SUMUP_MERCHANT_CODE: ${{ secrets.SUMUP_MERCHANT_CODE }}
        run: |
          set -euo pipefail
          node ../../scripts/sync-worker-shared.mjs
          npm ci
          DEFAULT_WORKER="https://reimagined-octo-meme.cgr28.workers.dev"
          PREVIEW_WORKER="https://reimagined-octo-meme-sa-preview.cgr28.workers.dev"
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::warning::Skipping preview Worker deploy — Pages preview would call production and cannot enforce the customer gate."
            echo "url=$DEFAULT_WORKER" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --env preview
            fi
          }
          put_secret GOOGLE_PLACES_API_KEY "${GOOGLE_PLACES_API_KEY:-}"
          put_secret IDEAL_POSTCODES_API_KEY "${IDEAL_POSTCODES_API_KEY:-}"
          put_secret GETADDRESS_API_KEY "${GETADDRESS_API_KEY:-}"
          put_secret WEB3FORMS_ACCESS_KEY "${WEB3FORMS_ACCESS_KEY:-}"
          if [ -n "${SUMUP_API_KEY:-}" ] && [ -n "${SUMUP_MERCHANT_CODE:-}" ]; then
            put_secret SUMUP_API_KEY "$SUMUP_API_KEY"
            put_secret SUMUP_MERCHANT_CODE "$SUMUP_MERCHANT_CODE"
          else
            echo "::warning::SumUp secrets missing on preview Worker — AVAILABLE Pay now may not open checkout."
          fi
          npx wrangler deploy --env preview
          echo "url=$PREVIEW_WORKER" >> "$GITHUB_OUTPUT"
          echo "::notice::Preview Worker (not production traffic): $PREVIEW_WORKER"

  build-and-deploy:
    needs: preview-worker
    runs-on: ubuntu-latest
    environment:
      name: Preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static site (preview)
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GETADDRESS_DOMAIN_TOKEN: ${{ secrets.GETADDRESS_DOMAIN_TOKEN }}
          BOOKINGS_API_URL: ${{ secrets.BOOKINGS_API_URL }}
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          GOOGLE_ADS_ID: ${{ secrets.GOOGLE_ADS_ID }}
          GOOGLE_ADS_QUOTE_CONVERSION_LABEL: ${{ secrets.GOOGLE_ADS_QUOTE_CONVERSION_LABEL }}
          GOOGLE_ADS_BOOKING_REQUEST_CONVERSION_LABEL: ${{ secrets.GOOGLE_ADS_BOOKING_REQUEST_CONVERSION_LABEL }}
          GOOGLE_ADS_PURCHASE_CONVERSION_LABEL: ${{ secrets.GOOGLE_ADS_PURCHASE_CONVERSION_LABEL }}
          GOOGLE_ADS_BOOKING_CONVERSION_LABEL: ${{ secrets.GOOGLE_ADS_BOOKING_CONVERSION_LABEL }}
        run: |
          KEY="${GOOGLE_PLACES_API_KEY:-${GOOGLE_API_KEY:-${GOOGLE_MAPS_API_KEY}}}"
          WORKER_PREVIEW="${{ needs.preview-worker.outputs.url }}"
          if [ -n "$WORKER_PREVIEW" ]; then
            BOOKINGS_API_URL="${WORKER_PREVIEW%/}/bookings"
          elif [ -z "$BOOKINGS_API_URL" ] || [[ "$BOOKINGS_API_URL" == *"myairporttaxini.co.uk"* ]]; then
            BOOKINGS_API_URL="https://reimagined-octo-meme.cgr28.workers.dev/bookings"
          fi
          ADDRESSES_API_URL="${BOOKINGS_API_URL%/bookings}/addresses"
          echo "Preview build → Worker API $BOOKINGS_API_URL"
          echo "Dispatch note: ${{ inputs.note }}"
          NEXT_PUBLIC_GOOGLE_PLACES_API_KEY="$KEY" \
          NEXT_PUBLIC_GETADDRESS_API_KEY="$GETADDRESS_DOMAIN_TOKEN" \
          NEXT_PUBLIC_BOOKINGS_API_URL="$BOOKINGS_API_URL" \
          NEXT_PUBLIC_ADDRESSES_API_URL="$ADDRESSES_API_URL" \
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY="$WEB3FORMS_ACCESS_KEY" \
          NEXT_PUBLIC_GOOGLE_ADS_ID="$GOOGLE_ADS_ID" \
          NEXT_PUBLIC_GOOGLE_ADS_QUOTE_CONVERSION_LABEL="$GOOGLE_ADS_QUOTE_CONVERSION_LABEL" \
          NEXT_PUBLIC_GOOGLE_ADS_BOOKING_REQUEST_CONVERSION_LABEL="$GOOGLE_ADS_BOOKING_REQUEST_CONVERSION_LABEL" \
          NEXT_PUBLIC_GOOGLE_ADS_PURCHASE_CONVERSION_LABEL="$GOOGLE_ADS_PURCHASE_CONVERSION_LABEL" \
          NEXT_PUBLIC_GOOGLE_ADS_BOOKING_CONVERSION_LABEL="$GOOGLE_ADS_BOOKING_CONVERSION_LABEL" \
          GITHUB_PAGES=true npm run build
          node scripts/fix-github-pages-paths.mjs

      - name: Deploy to Cloudflare Pages preview project
        id: deploy
        working-directory: .
        env:
          # Prefer a Pages-capable token; fall back to the shared Workers token.
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TOKEN="${CLOUDFLARE_PAGES_API_TOKEN:-$CLOUDFLARE_API_TOKEN}"
          if [ -z "$TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Need CLOUDFLARE_PAGES_API_TOKEN (or CLOUDFLARE_API_TOKEN) and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN="$TOKEN"
          npm install --no-save wrangler@3.109.0
          BRANCH_SAFE="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-50)"
          # wrangler pages deploy does not accept --compatibility-date (Workers-only flag).
          set +e
          OUTPUT="$(npx wrangler pages deploy out \
            --project-name=my-airport-taxi-ni-preview \
            --branch="$BRANCH_SAFE" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-dirty=true 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            if printf '%s' "$OUTPUT" | grep -qiE 'Authentication error|code: 10000'; then
              echo "::error::Cloudflare rejected Pages API auth (code 10000)."
              echo "::error::The token can deploy Workers but lacks Cloudflare Pages permission, or project my-airport-taxi-ni-preview is inaccessible."
              echo "::error::Fix: Cloudflare Dashboard → My Profile → API Tokens → edit/create token with Account → Cloudflare Pages → Edit (and Account Settings → Read)."
              echo "::error::Optional: store that token as GitHub secret CLOUDFLARE_PAGES_API_TOKEN (keeps Workers token unchanged)."
              echo "::error::Also create Pages project named my-airport-taxi-ni-preview if it does not exist yet."
            fi
            exit "$STATUS"
          fi
          URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' | tail -1 || true)"
          if [ -z "$URL" ]; then
            URL="https://${BRANCH_SAFE}.my-airport-taxi-ni-preview.pages.dev"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Preview frontend URL: $URL/?smartAvailabilityPreview=1"
          echo "::notice::Stable project URL: https://my-airport-taxi-ni-preview.pages.dev/?smartAvailabilityPreview=1"
