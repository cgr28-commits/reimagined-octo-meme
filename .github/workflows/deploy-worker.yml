name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/addresses/**"
      - "shared/**"
      - "scripts/ensure-alias-worker.mjs"
      - "scripts/sync-worker-shared.mjs"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/addresses/package-lock.json

      - name: Sync shared modules into worker
        run: node scripts/sync-worker-shared.mjs

      - name: Install worker dependencies
        working-directory: workers/addresses
        run: npm ci

      - name: Typecheck and build worker
        working-directory: workers/addresses
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/addresses/package-lock.json

      - name: Sync shared modules into worker
        run: node scripts/sync-worker-shared.mjs

      - name: Install worker dependencies
        working-directory: workers/addresses
        run: npm ci

      - name: Deploy main worker (reimagined-octo-meme)
        working-directory: workers/addresses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON }}
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          CI: "true"
          WORKERS_CI: "1"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Skipping deploy — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub → Settings → Secrets → Actions."
            echo "::warning::For first-time setup (KV namespace + worker secrets), run locally: npm run setup:worker"
            exit 0
          fi
          if [ -n "$GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON" ]; then
            echo "Syncing Google Calendar secrets…"
            printf '%s' "${GOOGLE_CALENDAR_ID:-colinrice876@gmail.com}" | npx wrangler secret put GOOGLE_CALENDAR_ID
            printf '%s' "$GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON" | npx wrangler secret put GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON
          else
            echo "::notice::Google Calendar not configured — add GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON to GitHub Actions secrets."
          fi
          if [ -n "$WEB3FORMS_ACCESS_KEY" ]; then
            echo "Syncing Web3Forms secret…"
            printf '%s' "$WEB3FORMS_ACCESS_KEY" | npx wrangler secret put WEB3FORMS_ACCESS_KEY
          else
            echo "::notice::WEB3FORMS_ACCESS_KEY not set — paid booking emails may fail until configured."
          fi
          npm run deploy
