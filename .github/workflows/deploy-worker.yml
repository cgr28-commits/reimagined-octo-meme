name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/addresses/**"
      - "shared/**"
      - "scripts/ensure-alias-worker.mjs"
      - "scripts/sync-worker-shared.mjs"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
    inputs:
      seed_same_fare_amendment_test:
        description: "After deploy, seed isolated same-fare Manage Booking fixture (no SumUp / no card charge)"
        type: boolean
        default: false
      manage_booking_base_url:
        description: "Pages Preview origin for Manage Booking links (no trailing slash)"
        required: false
        default: "https://cursor-save-quote-payload-fi.my-airport-taxi-ni-preview.pages.dev"
      customer_email:
        description: "Test customer email for amendment confirmation emails"
        required: false
        default: "cgr28@hotmail.co.uk"

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/addresses/package-lock.json

      - name: Sync shared modules into worker
        run: node scripts/sync-worker-shared.mjs

      - name: Install worker dependencies
        working-directory: workers/addresses
        run: npm ci

      - name: Typecheck and build worker
        working-directory: workers/addresses
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/addresses/package-lock.json

      - name: Sync shared modules into worker
        run: node scripts/sync-worker-shared.mjs

      - name: Install worker dependencies
        working-directory: workers/addresses
        run: npm ci

      - name: Deploy main worker (reimagined-octo-meme)
        working-directory: workers/addresses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON }}
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          SUMUP_MERCHANT_CODE: ${{ secrets.SUMUP_MERCHANT_CODE }}
          DRIVER_ACCESS_KEY: ${{ secrets.DRIVER_ACCESS_KEY }}
          OWNER_ACCESS_KEY: ${{ secrets.OWNER_ACCESS_KEY }}
          AD_FRAUD_HASH_SALT: ${{ secrets.AD_FRAUD_HASH_SALT }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY || secrets.GOOGLE_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
          IDEAL_POSTCODES_API_KEY: ${{ secrets.IDEAL_POSTCODES_API_KEY }}
          GETADDRESS_API_KEY: ${{ secrets.GETADDRESS_API_KEY }}
          CI: "true"
          WORKERS_CI: "1"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Skipping deploy — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub → Settings → Secrets → Actions."
            echo "::warning::For first-time setup (KV namespace + worker secrets), run locally: npm run setup:worker"
            exit 0
          fi
          if [ -n "$GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON" ]; then
            echo "Syncing Google Calendar secrets…"
            printf '%s' "${GOOGLE_CALENDAR_ID:-colinrice876@gmail.com}" | npx wrangler secret put GOOGLE_CALENDAR_ID
            printf '%s' "$GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON" > /tmp/gcal-service-account.json
            npx wrangler secret put GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON < /tmp/gcal-service-account.json
            rm -f /tmp/gcal-service-account.json
          else
            echo "::notice::Google Calendar not configured — add GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON to GitHub Actions secrets."
          fi
          if [ -n "$GOOGLE_PLACES_API_KEY" ]; then
            echo "Syncing GOOGLE_PLACES_API_KEY secret…"
            printf '%s' "$GOOGLE_PLACES_API_KEY" | npx wrangler secret put GOOGLE_PLACES_API_KEY
          else
            echo "::error::GOOGLE_PLACES_API_KEY missing — address autocomplete will return empty suggestions."
          fi
          if [ -n "$IDEAL_POSTCODES_API_KEY" ]; then
            echo "Syncing IDEAL_POSTCODES_API_KEY secret…"
            printf '%s' "$IDEAL_POSTCODES_API_KEY" | npx wrangler secret put IDEAL_POSTCODES_API_KEY
          else
            echo "::notice::IDEAL_POSTCODES_API_KEY not set — using free postcode + house number flow via Google Places."
          fi
          if [ -n "$GETADDRESS_API_KEY" ]; then
            echo "Syncing GETADDRESS_API_KEY secret…"
            printf '%s' "$GETADDRESS_API_KEY" | npx wrangler secret put GETADDRESS_API_KEY
          else
            echo "::notice::GETADDRESS_API_KEY not set — getAddress.io is discontinued; use IDEAL_POSTCODES_API_KEY."
          fi
          if [ -n "$WEB3FORMS_ACCESS_KEY" ]; then
            echo "Syncing Web3Forms secret…"
            printf '%s' "$WEB3FORMS_ACCESS_KEY" | npx wrangler secret put WEB3FORMS_ACCESS_KEY
          else
            echo "::notice::WEB3FORMS_ACCESS_KEY not set — paid booking emails may fail until configured."
          fi
          if [ -n "$RESEND_API_KEY" ]; then
            echo "Syncing RESEND_API_KEY secret…"
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "::notice::RESEND_API_KEY not set — add it under GitHub Actions secrets for preferred branded customer invoices via Resend."
          fi
          if [ -n "$SUMUP_API_KEY" ] && [ -n "$SUMUP_MERCHANT_CODE" ]; then
            echo "Syncing SumUp secrets…"
            printf '%s' "$SUMUP_API_KEY" | npx wrangler secret put SUMUP_API_KEY
            printf '%s' "$SUMUP_MERCHANT_CODE" | npx wrangler secret put SUMUP_MERCHANT_CODE
          else
            echo "::notice::SUMUP_API_KEY / SUMUP_MERCHANT_CODE not both set in GitHub Actions — existing Cloudflare Worker SumUp secrets are left unchanged."
          fi
          if [ -n "$DRIVER_ACCESS_KEY" ]; then
            echo "Syncing DRIVER_ACCESS_KEY secret…"
            printf '%s' "$DRIVER_ACCESS_KEY" | npx wrangler secret put DRIVER_ACCESS_KEY
          else
            echo "::notice::DRIVER_ACCESS_KEY not set — add it to GitHub Actions secrets or run npm run setup:worker locally."
          fi
          if [ -n "$OWNER_ACCESS_KEY" ]; then
            echo "Syncing OWNER_ACCESS_KEY secret…"
            printf '%s' "$OWNER_ACCESS_KEY" | npx wrangler secret put OWNER_ACCESS_KEY
          fi
          if [ -n "$AD_FRAUD_HASH_SALT" ]; then
            echo "Syncing AD_FRAUD_HASH_SALT secret…"
            printf '%s' "$AD_FRAUD_HASH_SALT" | npx wrangler secret put AD_FRAUD_HASH_SALT
          else
            echo "::notice::AD_FRAUD_HASH_SALT not set — Ad Fraud ingest returns 503 until the Worker secret is configured."
          fi
          if [ -n "$GOOGLE_ADS_DEVELOPER_TOKEN" ] \
            && [ -n "$GOOGLE_ADS_CLIENT_ID" ] \
            && [ -n "$GOOGLE_ADS_CLIENT_SECRET" ] \
            && [ -n "$GOOGLE_ADS_REFRESH_TOKEN" ]; then
            echo "Syncing Google Ads API credentials…"
            printf '%s' "$GOOGLE_ADS_DEVELOPER_TOKEN" | npx wrangler secret put GOOGLE_ADS_DEVELOPER_TOKEN
            printf '%s' "$GOOGLE_ADS_CLIENT_ID" | npx wrangler secret put GOOGLE_ADS_CLIENT_ID
            printf '%s' "$GOOGLE_ADS_CLIENT_SECRET" | npx wrangler secret put GOOGLE_ADS_CLIENT_SECRET
            printf '%s' "$GOOGLE_ADS_REFRESH_TOKEN" | npx wrangler secret put GOOGLE_ADS_REFRESH_TOKEN
            if [ -n "$GOOGLE_ADS_LOGIN_CUSTOMER_ID" ]; then
              printf '%s' "$GOOGLE_ADS_LOGIN_CUSTOMER_ID" | npx wrangler secret put GOOGLE_ADS_LOGIN_CUSTOMER_ID
            fi
          else
            echo "::notice::Google Ads API credentials are incomplete — existing Cloudflare Worker secrets are left unchanged."
          fi
          npm run deploy

      - name: Check for PAID-but-unfinalized SumUp checkouts (read-only)
        env:
          OWNER_ACCESS_KEY: ${{ secrets.OWNER_ACCESS_KEY }}
          DRIVER_ACCESS_KEY: ${{ secrets.DRIVER_ACCESS_KEY }}
          WORKER_BASE_URL: https://reimagined-octo-meme.cgr28.workers.dev
        run: |
          ACCESS_KEY="${OWNER_ACCESS_KEY:-$DRIVER_ACCESS_KEY}"
          if [ -z "$ACCESS_KEY" ]; then
            echo "::warning::Read-only pending checkout check unavailable; no recovery attempted."
            exit 0
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          code=$(curl -sS -o "$response_file" -w "%{http_code}" \
            -H "Accept: application/json" \
            -H "X-Owner-Key: $ACCESS_KEY" \
            "$WORKER_BASE_URL/api/paid-bookings/pending?limit=40" || true)

          if [ "$code" != "200" ]; then
            echo "::warning::Read-only pending checkout check unavailable; no recovery attempted."
            exit 0
          fi

          pending_count=$(jq -r \
            'if (.needsFinalizeCount | type) == "number" then .needsFinalizeCount else empty end' \
            "$response_file" 2>/dev/null || true)
          if ! [[ "$pending_count" =~ ^[0-9]+$ ]]; then
            echo "::warning::Read-only pending checkout check returned an invalid count; no recovery attempted."
            exit 0
          fi

          if [ "$pending_count" -gt 0 ]; then
            echo "::warning::Read-only pending checkout candidates: $pending_count. Manual owner review required; no recovery was attempted."
          else
            echo "Read-only pending checkout candidates: 0."
          fi

      - name: Seed same-fare amendment test fixture
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_same_fare_amendment_test }}
        env:
          OWNER_ACCESS_KEY: ${{ secrets.OWNER_ACCESS_KEY }}
          MANAGE_BASE: ${{ inputs.manage_booking_base_url }}
          CUSTOMER_EMAIL: ${{ inputs.customer_email }}
          WORKER_URL: https://reimagined-octo-meme.cgr28.workers.dev
        run: |
          set -euo pipefail
          if [ -z "${OWNER_ACCESS_KEY:-}" ]; then
            echo "::error::OWNER_ACCESS_KEY secret is missing — cannot seed amendment test fixture"
            exit 1
          fi
          MANAGE_BASE="${MANAGE_BASE:-https://cursor-save-quote-payload-fi.my-airport-taxi-ni-preview.pages.dev}"
          CUSTOMER_EMAIL="${CUSTOMER_EMAIL:-cgr28@hotmail.co.uk}"
          BODY=$(jq -n \
            --arg base "$MANAGE_BASE" \
            --arg email "$CUSTOMER_EMAIL" \
            '{manageBookingBaseUrl:$base, customerEmail:$email}')
          # Do not print OWNER_ACCESS_KEY. Response JSON has no secret key material.
          RESP=$(curl -sS -X POST "$WORKER_URL/paid-bookings/amendment-test/seed" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "X-Owner-Key: $OWNER_ACCESS_KEY" \
            -d "$BODY")
          OK=$(echo "$RESP" | jq -r '.ok // false')
          if [ "$OK" != "true" ]; then
            # Fixture seed is optional post-deploy QA — do not fail the Worker publish.
            echo "::warning::Seed failed (non-blocking): $(echo "$RESP" | jq -r '.error // "unknown"')"
            exit 0
          fi
          MAT=$(echo "$RESP" | jq -r '.fixture.customerReference')
          URL=$(echo "$RESP" | jq -r '.fixture.manageBookingUrl')
          DATE=$(echo "$RESP" | jq -r '.fixture.tripDate')
          TIME=$(echo "$RESP" | jq -r '.fixture.tripTime')
          PAID=$(echo "$RESP" | jq -r '.fixture.amountPaidLabel')
          {
            echo "## Same-fare amendment test fixture"
            echo ""
            echo "- **MAT:** \`$MAT\`"
            echo "- **Manage Booking:** $URL"
            echo "- **Current schedule:** $DATE at $TIME"
            echo "- **Fare / paid:** $PAID (preview/test fixture — no live card charge)"
            echo "- **Change only:** 10:00 → 10:15, then Review Changes (expect £0 top-up)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::MAT=$MAT schedule=$DATE $TIME paid=$PAID"
          echo "::notice::Manage=$URL"

      - name: Resend latest paid confirmation when trigger requests it
        env:
          OWNER_ACCESS_KEY: ${{ secrets.OWNER_ACCESS_KEY }}
          DRIVER_ACCESS_KEY: ${{ secrets.DRIVER_ACCESS_KEY }}
          WORKER_BASE_URL: https://reimagined-octo-meme.cgr28.workers.dev
        run: |
          if ! grep -q '^RUN_RESEND=1$' scripts/trigger-resend-latest-paid.txt 2>/dev/null; then
            echo "No RUN_RESEND=1 in scripts/trigger-resend-latest-paid.txt — skipping resend."
            exit 0
          fi
          ACCESS_KEY="${OWNER_ACCESS_KEY:-$DRIVER_ACCESS_KEY}"
          if [ -z "$ACCESS_KEY" ]; then
            echo "::error::OWNER_ACCESS_KEY (or DRIVER_ACCESS_KEY) secret is not set — cannot resend confirmation"
            exit 1
          fi
          export OWNER_ACCESS_KEY="$ACCESS_KEY"
          echo "RUN_RESEND=1 detected — resending latest paid booking to customer + bookings@"
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/pb.json -w "%{http_code}" \
              -H "Accept: application/json" \
              -H "X-Owner-Key: $ACCESS_KEY" \
              "$WORKER_BASE_URL/api/paid-bookings?days=7&limit=1" || true)
            if [ "$code" = "200" ]; then
              break
            fi
            echo "paid-bookings returned $code — waiting… body=$(head -c 200 /tmp/pb.json)"
            sleep 15
          done
          node scripts/resend-latest-paid-confirmation.mjs
