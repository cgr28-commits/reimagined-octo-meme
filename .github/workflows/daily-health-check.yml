# Daily website health check: verify the live site works, auto-fix what we can.

name: Daily health check

on:
  schedule:
    # 07:00 UTC every day
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: daily-health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run website health check
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          HEALTH_CHECK_NOTIFY_EMAIL: ${{ secrets.HEALTH_CHECK_NOTIFY_EMAIL || 'bookings@myairporttaxini.co.uk' }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/daily-health-check.mjs

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-health-report-${{ github.run_id }}
          path: reports/daily-health-*.json
          retention-days: 30

      - name: Commit auto-fixes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml public/my-airport-taxi-ni.vcf shared/contact-vcard.ts workers/addresses/shared/contact-vcard.ts || true
          if git diff --staged --quiet; then
            echo "No auto-fix file changes"
          else
            git commit -m "chore: daily health check auto-fix"
            git pull --rebase origin main
            git push
          fi

      - name: Redeploy after remaining failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT=$(ls reports/daily-health-*.json | head -1)
          node <<'NODE'
          const fs = require("fs");
          const reportPath = fs.readdirSync("reports").find((f) => f.startsWith("daily-health-"));
          const r = JSON.parse(fs.readFileSync(`reports/${reportPath}`, "utf8"));
          const fails = r.checks.filter((c) => c.status === "fail");
          const workerFails = fails.some((c) => /worker|api|addresses|bookings|quote leads|flight|contact vcard/i.test(c.name));
          const siteFails = fails.some((c) => /homepage|contact|terms|privacy|favicon|logo|page|branding|qr|photo/i.test(c.name));
          fs.writeFileSync("/tmp/health-redeploy.json", JSON.stringify({ workerFails, siteFails }));
          console.log(JSON.stringify({ workerFails, siteFails, failCount: fails.length }));
          NODE

          WORKER_FAIL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/health-redeploy.json','utf8')).workerFails)")
          SITE_FAIL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/health-redeploy.json','utf8')).siteFails)")

          if [ "$WORKER_FAIL" = "true" ]; then
            echo "Worker/API checks failed — triggering worker redeploy"
            gh workflow run deploy-worker.yml --ref main
          fi
          if [ "$SITE_FAIL" = "true" ]; then
            echo "Website checks failed — triggering Pages redeploy"
            gh workflow run deploy-pages.yml --ref main || true
          fi
          if [ "$WORKER_FAIL" != "true" ] && [ "$SITE_FAIL" != "true" ]; then
            echo "No redeploy trigger matched"
          fi

      - name: Summarise for Actions log
        if: always()
        run: |
          REPORT=$(ls reports/daily-health-*.json | head -1)
          echo "## Daily website health check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          node -e "
            const r = require('./' + process.argv[1]);
            const icon = r.ok ? '✅' : '❌';
            console.log(icon + ' **Overall:** ' + (r.ok ? 'Website healthy' : r.summary.fail + ' failure(s)'));
            console.log('');
            console.log('| Status | Check | Detail |');
            console.log('|--------|-------|--------|');
            for (const c of r.checks) {
              console.log('| ' + c.status + ' | ' + c.name + ' | ' + c.detail.replace(/\\|/g, '/') + ' |');
            }
            if (r.fixes.length) {
              console.log('');
              console.log('**Auto-fixes:**');
              for (const f of r.fixes) console.log('- ' + f.action + ': ' + f.detail);
            }
          " "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update GitHub issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT=$(ls reports/daily-health-*.json | head -1)
          TITLE="Website health check failed — $(date -u +%Y-%m-%d)"
          BODY=$(node -e "
            const r = require('./' + process.argv[1]);
            const fails = r.checks.filter(c => c.status === 'fail');
            let md = 'Automated website health check found **' + fails.length + '** failure(s).\\n\\n';
            md += '[View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\\n\\n';
            md += '### Failures\\n';
            for (const f of fails) md += '- **' + f.name + '**: ' + f.detail + '\\n';
            if (r.fixes.length) {
              md += '\\n### Auto-fixes applied\\n';
              for (const x of r.fixes) md += '- ' + x.action + ': ' + x.detail + '\\n';
            }
            console.log(md);
          " "$REPORT")

          EXISTING=$(gh issue list --label "health-check" --state open --limit 1 --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Commented on issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "health-check" || gh issue create --title "$TITLE" --body "$BODY" || true
          fi
