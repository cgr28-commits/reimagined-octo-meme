# Scratch helper (branch seo/img-scratch only): fetch freely licensed Wikimedia
# Commons photos for SEO pages and commit them back to this scratch branch.
name: Fetch Commons images (scratch)
"on":
  push:
    branches: [seo/img-scratch]
    paths: [scratch/requests.json]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pillow>=11.3"
      - run: python scratch/fetch_commons.py scratch/requests.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A review public/images/hero/optimized
          git commit -m "Commons image fetch results" || echo "nothing to commit"
          git push
