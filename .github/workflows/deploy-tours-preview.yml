# WP-B0: isolated PRIVATE preview for Private Tours work (branches tours/**).
#
# Deploys ONLY to the separate "My Airport Taxi NI Staging" Cloudflare account
# (ecad568dc411e28a3e435ef40b36c2b5): its own Worker, KV, Durable Objects and Pages project.
# It never touches the live Worker, live KV, live Durable Objects, GitHub Pages, the custom domain
# or any production route, and it never runs for main or cursor/* branches.
#
# Secrets: STAGING credentials only (allowlist enforced by scripts/tours-preview-guard.mjs before any
# secret is used). No production secret is referenced here, directly or indirectly:
#   STAGING_CLOUDFLARE_API_TOKEN       staging-account token
#   "staging" environment: STAGING_STRIPE_SECRET_KEY / STAGING_STRIPE_PUBLISHABLE_KEY / STAGING_STRIPE_WEBHOOK_SECRET (Stripe TEST mode)
# Optional (preview works without them): TOURS_PREVIEW_ACCESS_CODE (own preview access code), TOURS_PREVIEW_TESTER_EMAIL, TOURS_PREVIEW_OWNER_KEY, TOURS_PREVIEW_RESEND_API_KEY
# With no tester email every preview email is blocked. See docs/tours-preview.md.

name: Deploy Tours Preview (isolated staging account)

"on":
  workflow_dispatch:
  push:
    branches:
      - "tours/**"

concurrency:
  group: tours-preview
  cancel-in-progress: true

permissions:
  contents: read

env:
  STAGING_ACCOUNT_ID: ecad568dc411e28a3e435ef40b36c2b5
  PREVIEW_WORKER_NAME: reimagined-octo-meme-tours-preview
  PREVIEW_PAGES_PROJECT: matni-tours-preview
  TOURS_SETTINGS_WORKER_NAME: reimagined-octo-meme-tours-settings-preview
  WRANGLER_CONFIG: wrangler.tours-preview.generated.toml

jobs:
  preview:
    runs-on: ubuntu-latest
    outputs:
      worker_ready: ${{ steps.worker.outputs.url != '' }}
      stripe_set: ${{ steps.worker.outputs.stripe_set }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No secrets are available to these two steps.
      - name: Isolation guard self-test (must fail on production inputs)
        run: node scripts/tours-preview-guard.mjs --self-test

      - name: Workflow uses staging secrets only
        run: node scripts/tours-preview-guard.mjs --check-workflow

      - name: Check the staging token is available
        id: ready
        env:
          STAGING_CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$STAGING_CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Tours preview not deployed: GitHub secret STAGING_CLOUDFLARE_API_TOKEN is missing."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Staging token has no production access
        if: steps.ready.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: node scripts/tours-preview-guard.mjs --probe-token

      # Installs run without any secret in their environment.
      - name: Install dependencies
        if: steps.ready.outputs.ready == 'true'
        run: |
          npm ci
          npm --prefix workers/addresses ci

      - name: Prepare isolated storage and config (staging account only)
        if: steps.ready.outputs.ready == 'true'
        id: prepare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.STAGING_ACCOUNT_ID }}
          TOURS_PREVIEW_TESTER_EMAIL: ${{ secrets.TOURS_PREVIEW_TESTER_EMAIL }}
        run: |
          # Keep tester addresses out of the run log.
          for address in $(printf '%s' "${TOURS_PREVIEW_TESTER_EMAIL:-}" | tr ',' ' '); do echo "::add-mask::$address"; done
          node scripts/tours-preview-prepare.mjs

      - name: Deploy preview Worker (staging account only)
        if: steps.ready.outputs.ready == 'true'
        id: worker
        working-directory: workers/addresses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.STAGING_ACCOUNT_ID }}
          PREVIEW_OWNER_KEY: ${{ secrets.TOURS_PREVIEW_OWNER_KEY }}
          PREVIEW_RESEND_API_KEY: ${{ secrets.TOURS_PREVIEW_RESEND_API_KEY }}
          SITE_HOST: ${{ steps.prepare.outputs.site_host }}
        run: |
          set -euo pipefail
          # Last gate before anything reaches Cloudflare.
          node ../../scripts/tours-preview-guard.mjs --check-config "$WRANGLER_CONFIG"
          if [ -z "${PREVIEW_OWNER_KEY:-}" ]; then
            PREVIEW_OWNER_KEY="$(openssl rand -hex 32)"
            echo "::add-mask::$PREVIEW_OWNER_KEY"
            echo "::notice::No TOURS_PREVIEW_OWNER_KEY secret: the preview Owner Dashboard cannot be signed in to."
          fi
          if [ "${#PREVIEW_OWNER_KEY}" -lt 24 ]; then echo "::error::TOURS_PREVIEW_OWNER_KEY must be at least 24 characters."; exit 1; fi

          OUTPUT="$(npx wrangler deploy -c "$WRANGLER_CONFIG" 2>&1)" || { echo "$OUTPUT" | grep -v -i "tester\|EMAIL"; exit 1; }
          echo "$OUTPUT" | grep -v -i "tester\|EMAIL" || true
          URL="$(printf '%s\n' "$OUTPUT" | grep -Eo "https://${PREVIEW_WORKER_NAME}\.[a-z0-9-]+\.workers\.dev" | head -1)"
          if [ -z "$URL" ]; then echo "::error::Could not read the preview Worker URL."; exit 1; fi

          put_secret() { if [ -n "$2" ]; then printf '%s' "$2" | npx wrangler secret put "$1" -c "$WRANGLER_CONFIG" >/dev/null; echo "secret set: $1"; fi; }
          put_secret OWNER_ACCESS_KEY "$PREVIEW_OWNER_KEY"
          # Cloudflare's published always-pass Turnstile TEST secret (not a real secret).
          put_secret TURNSTILE_SECRET_KEY "1x0000000000000000000000000000000AA"
          put_secret RESEND_API_KEY "${PREVIEW_RESEND_API_KEY:-}"
          # Nothing live may ever be set on this Worker.
          SECRETS="$(npx wrangler secret list -c "$WRANGLER_CONFIG")"
          for forbidden in SUMUP_API_KEY SUMUP_MERCHANT_CODE DRIVER_ACCESS_KEY D360_API_KEY WHATSAPP_ACCESS_TOKEN GOOGLE_ADS_DEVELOPER_TOKEN GOOGLE_PLACES_API_KEY STRIPE_WEBHOOK_SECRET_LIVE; do
            if printf '%s' "$SECRETS" | grep -q "\"$forbidden\""; then echo "::error::Forbidden secret on the preview Worker: $forbidden"; exit 1; fi
          done

          # A new workers.dev address can take a minute to start answering.
          CODE=""
          for attempt in $(seq 1 18); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' -H "Origin: https://${SITE_HOST}" "$URL/events/public" || true)"
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          [ "$CODE" = "200" ] || { echo "::error::Preview Worker did not answer (HTTP $CODE)."; exit 1; }
          # The live website must NOT be allowed to call the preview Worker.
          if curl -sS -D - -o /dev/null -H "Origin: https://www.myairporttaxini.co.uk" "$URL/events/public" | grep -i '^access-control-allow-origin:' | grep -qi "myairporttaxini"; then
            echo "::error::Preview Worker accepts the live website origin."; exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Preview Worker (staging account): $URL"

      - name: Deployed bindings are staging-only (no production KV or Durable Objects)
        if: steps.ready.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          EXPECTED_KV_IDS: ${{ steps.prepare.outputs.kv_ids }}
        run: node scripts/tours-preview-guard.mjs --check-deployed

      - name: Build the preview website against the preview Worker
        if: steps.ready.outputs.ready == 'true'
        env:
          PREVIEW_WORKER_ORIGIN: ${{ steps.worker.outputs.url }}
          TOURS_ACCESS_CODE: ${{ secrets.TOURS_PREVIEW_ACCESS_CODE }}
        run: |
          set -euo pipefail
          # next/font downloads can fail briefly: retry.
          for attempt in 1 2 3; do
            if node scripts/tours-preview-site.mjs; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 15
          done
          # Private-link gate, no search engines, no live-domain marker.
          cp scripts/bespoke-preview-gate.js out/_worker.js
          # Separate access code and cookie for this preview. The code is only ever a GitHub secret;
          # the workflow stores just its SHA-256 in the deployed gate. Nothing is printed.
          sed -i 's/const COOKIE = "matni_preview";/const COOKIE = "matni_tours_preview";/' out/_worker.js
          grep -q 'const COOKIE = "matni_tours_preview";' out/_worker.js || { echo "::error::Could not set the tours preview cookie name."; exit 1; }
          # Fail closed: the tours preview must never be served with the shared bespoke access code.
          if [ -z "${TOURS_ACCESS_CODE:-}" ]; then
            echo "::error::TOURS_PREVIEW_ACCESS_CODE secret is missing. The tours preview is not deployed with the shared bespoke access code."
            exit 1
          fi
          echo "::add-mask::$TOURS_ACCESS_CODE"
          if [ "${#TOURS_ACCESS_CODE}" -lt 24 ]; then echo "::error::TOURS_PREVIEW_ACCESS_CODE must be at least 24 characters."; exit 1; fi
          HASH="$(printf '%s' "$TOURS_ACCESS_CODE" | sha256sum | cut -d' ' -f1)"
          BESPOKE_HASH="$(sed -n 's/^const ACCESS_CODE_SHA256 = "\([a-f0-9]*\)";/\1/p' scripts/bespoke-preview-gate.js)"
          if [ "$HASH" = "$BESPOKE_HASH" ]; then echo "::error::TOURS_PREVIEW_ACCESS_CODE must differ from the bespoke preview access code."; exit 1; fi
          sed -i "s/^const ACCESS_CODE_SHA256 = \"[a-f0-9]*\";/const ACCESS_CODE_SHA256 = \"${HASH}\";/" out/_worker.js
          grep -q "const ACCESS_CODE_SHA256 = \"${HASH}\";" out/_worker.js || { echo "::error::Could not set the tours preview access code hash."; exit 1; }
          if grep -q "$BESPOKE_HASH" out/_worker.js; then echo "::error::The bespoke access code hash is still present in the tours gate."; exit 1; fi
          echo "::notice::Tours preview uses its own access code and cookie."
          printf 'User-agent: *\nDisallow: /\n' > out/robots.txt
          rm -f out/CNAME out/sitemap.xml

      - name: Deploy the preview website (staging account only)
        if: steps.ready.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.STAGING_ACCOUNT_ID }}
          SITE_HOST: ${{ steps.prepare.outputs.site_host }}
          TOURS_ACCESS_CODE: ${{ secrets.TOURS_PREVIEW_ACCESS_CODE }}
        run: |
          set -euo pipefail
          echo "::add-mask::$TOURS_ACCESS_CODE"
          npm install --no-save wrangler@3.109.0
          npx wrangler pages deploy out --project-name="$PREVIEW_PAGES_PROJECT" --branch=preview --commit-hash="${GITHUB_SHA}" --commit-dirty=true
          # Without the private link the site must answer 401, never the pages.
          CODE=""
          for attempt in $(seq 1 12); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://${SITE_HOST}/" || true)"
            [ "$CODE" = "401" ] && break
            sleep 10
          done
          if [ "$CODE" != "401" ]; then echo "::error::Preview site is not behind the private link (HTTP $CODE)."; exit 1; fi
          curl -sS -D - -o /dev/null "https://${SITE_HOST}/" | grep -qi '^x-robots-tag:.*noindex' || { echo "::error::Preview site is missing the noindex header."; exit 1; }
          # Access-code and cookie isolation, proven against the deployed site.
          WRONG="$(curl -s -o /dev/null -w '%{http_code}' "https://${SITE_HOST}/?k=not-the-code-$(date +%s)")"
          [ "$WRONG" = "401" ] || { echo "::error::A wrong access code was not refused (HTTP $WRONG)."; exit 1; }
          HEADERS="$(curl -sS -D - -o /dev/null --get --data-urlencode "k=${TOURS_ACCESS_CODE}" "https://${SITE_HOST}/")"
          printf '%s' "$HEADERS" | head -1 | grep -q ' 302' || { echo "::error::The tours preview access code was not accepted."; exit 1; }
          printf '%s' "$HEADERS" | grep -qi '^set-cookie: matni_tours_preview=' || { echo "::error::The tours preview did not set its own cookie."; exit 1; }
          printf '%s' "$HEADERS" | grep -qi '^set-cookie: matni_preview=' && { echo "::error::The tours preview set the bespoke cookie name."; exit 1; }
          # Use the cookie value exactly as the gate issued it (URL-encoded); never print it.
          VALUE="$(printf '%s' "$HEADERS" | tr -d '\r' | sed -n 's/^[Ss]et-[Cc]ookie: matni_tours_preview=\([^;]*\);.*/\1/p' | head -1)"
          [ -n "$VALUE" ] || { echo "::error::Could not read the tours preview cookie value."; exit 1; }
          echo "::add-mask::$VALUE"
          # A cookie carrying the bespoke cookie name must not open the site.
          CROSS="$(curl -s -o /dev/null -w '%{http_code}' -H "Cookie: matni_preview=${VALUE}" "https://${SITE_HOST}/")"
          [ "$CROSS" = "401" ] || { echo "::error::The bespoke cookie name opened the tours preview (HTTP $CROSS)."; exit 1; }
          OWN="$(curl -s -o /dev/null -w '%{http_code}' -H "Cookie: matni_tours_preview=${VALUE}" "https://${SITE_HOST}/")"
          [ "$OWN" = "200" ] || { echo "::error::The tours preview cookie did not open the site (HTTP $OWN)."; exit 1; }
          echo "::notice::Access isolation verified: wrong code 401, own code accepted with its own cookie, bespoke cookie name refused."
          echo "::notice::Private preview website: https://${SITE_HOST}/ (open with the private link)"

  # WP-B1: owner-only Tour Settings store (Durable Object) on the STAGING account only.
  # Synthetic availability fixtures only. No production reads or writes, no routes, no KV.
  tours-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No secrets are available to these steps.
      - name: Tour settings unit tests
        run: npm --prefix workers/tours test

      - name: Isolation guard self-test and tours settings config check
        run: |
          node scripts/tours-preview-guard.mjs --self-test
          node scripts/tours-preview-guard.mjs --check-workflow
          node scripts/tours-preview-guard.mjs --check-tours-settings-config

      - name: Check the staging token is available
        id: ready
        env:
          STAGING_CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$STAGING_CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Tour settings Worker not deployed: GitHub secret STAGING_CLOUDFLARE_API_TOKEN is missing."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy tour settings Worker and smoke-test (staging account only)
        if: steps.ready.outputs.ready == 'true'
        working-directory: workers/tours
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.STAGING_ACCOUNT_ID }}
          SETTINGS_OWNER_KEY: ${{ secrets.TOURS_PREVIEW_OWNER_KEY }}
        run: |
          set -euo pipefail
          node ../../scripts/tours-preview-guard.mjs --check-tours-settings-config wrangler.toml
          if [ -z "${SETTINGS_OWNER_KEY:-}" ]; then
            SETTINGS_OWNER_KEY="$(openssl rand -hex 32)"
            echo "::notice::No TOURS_PREVIEW_OWNER_KEY secret: a random owner key was generated for this deploy (smoke tests only)."
          fi
          echo "::add-mask::$SETTINGS_OWNER_KEY"
          if [ "${#SETTINGS_OWNER_KEY}" -lt 24 ]; then echo "::error::TOURS_PREVIEW_OWNER_KEY must be at least 24 characters."; exit 1; fi

          OUTPUT="$(npx --yes wrangler@3.109.0 deploy -c wrangler.toml 2>&1)" || { echo "$OUTPUT"; exit 1; }
          echo "$OUTPUT"
          URL="$(printf '%s\n' "$OUTPUT" | grep -Eo "https://${TOURS_SETTINGS_WORKER_NAME}\.[a-z0-9-]+\.workers\.dev" | head -1)"
          if [ -z "$URL" ]; then echo "::error::Could not read the tours settings Worker URL."; exit 1; fi
          printf '%s' "$SETTINGS_OWNER_KEY" | npx --yes wrangler@3.109.0 secret put TOURS_OWNER_KEY -c wrangler.toml >/dev/null
          echo "secret set: TOURS_OWNER_KEY"

          CODE=""
          for attempt in $(seq 1 18); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "$URL/health" || true)"
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          [ "$CODE" = "200" ] || { echo "::error::Tours settings Worker did not answer (HTTP $CODE)."; exit 1; }

          # Owner authentication is enforced server-side.
          NOAUTH="$(curl -s -o /tmp/noauth.json -w '%{http_code}' "$URL/settings")"
          [ "$NOAUTH" = "401" ] || { echo "::error::Unauthenticated read was not refused (HTTP $NOAUTH): $(head -c 300 /tmp/noauth.json)"; exit 1; }
          BAD="$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer not-the-owner-key-000000000' "$URL/settings")"
          [ "$BAD" = "401" ] || { echo "::error::A wrong owner key was not refused (HTTP $BAD)."; exit 1; }

          AUTH="Authorization: Bearer ${SETTINGS_OWNER_KEY}"
          GOT="$(curl -sS -H "$AUTH" "$URL/settings")"
          printf '%s' "$GOT" | node -e 'const b=JSON.parse(require("fs").readFileSync(0,"utf8")); if(!b.ok||!Number.isInteger(b.version)||!/^[a-f0-9]{64}$/.test(b.hash)||b.settings.mandatory.capacity.maxPassengers!==4||b.settings.publicLaunch.enabled!==false||b.settings.commercial.availability.source!=="synthetic-staging-fixture"){console.error("::error::Unexpected settings document.");process.exit(1)}; console.log("settings document ok, version "+b.version)'

          # Mandatory rules are enforced by the deployed Worker (nothing is written by these checks).
          BAD_SETTINGS="$(printf '%s' "$GOT" | node -e 'const b=JSON.parse(require("fs").readFileSync(0,"utf8")); b.settings.mandatory.capacity.maxPassengers=7; b.settings.mandatory.cruise.returnBufferMinutes.longDistance=60; b.settings.commercial.availability.source="production-kv"; process.stdout.write(JSON.stringify({settings:b.settings}))')"
          VALIDATION="$(curl -sS -H "$AUTH" -H 'Content-Type: application/json' -d "$BAD_SETTINGS" "$URL/validate")"
          printf '%s' "$VALIDATION" | node -e 'const b=JSON.parse(require("fs").readFileSync(0,"utf8")); const c=b.errors.map(e=>e.code); for (const need of ["mandatory-capacity","mandatory-cruise-buffer","availability-source"]) if(!c.includes(need)){console.error("::error::Deployed validator missed "+need);process.exit(1)}; console.log("deployed validator rejects 7 passengers, short return buffer and non-synthetic availability")'
          STALE="$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH" -H 'Content-Type: application/json' -d '{"baseVersion":0,"reason":"smoke test stale","settings":{}}' "$URL/publish")"
          [ "$STALE" = "409" ] || { echo "::error::Stale baseVersion was not refused with 409 (HTTP $STALE)."; exit 1; }
          VERIFY="$(curl -sS -H "$AUTH" -H 'Content-Type: application/json' -d '{"version":1}' "$URL/verify")"
          printf '%s' "$VERIFY" | grep -q '"intact":true' || { echo "::error::Snapshot integrity check failed."; exit 1; }
          echo "::notice::Tours settings Worker (staging account): $URL. Auth, validation, concurrency and snapshot integrity verified."

      - name: Deployed bindings are staging-only (own Durable Object only)
        if: steps.ready.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: node scripts/tours-preview-guard.mjs --check-tours-settings-deployed

  # Stripe TEST keys from the "staging" environment. Only this small job runs in that environment.
  # If the "staging" environment does not yet allow tours/** branches GitHub rejects this job before it
  # starts; that must not fail the whole preview (payments then simply stay unavailable on the preview).
  stripe-sandbox:
    needs: preview
    continue-on-error: true
    if: needs.preview.outputs.worker_ready == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add Stripe test keys to the preview Worker (staging account only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.STAGING_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STAGING_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_SECRET_KEY:-}" ] || [ -z "${STRIPE_PUBLISHABLE_KEY:-}" ]; then
            echo "::notice::No Stripe test keys in the staging environment: payments stay unavailable on the preview."
            exit 0
          fi
          # TEST keys only. Anything else stops here and nothing is sent to Cloudflare.
          node scripts/tours-preview-guard.mjs --check-stripe
          # Run from an empty folder so no repository config (and no live account id) can be picked up.
          cd "$RUNNER_TEMP"
          printf '%s' "$STRIPE_SECRET_KEY" | npx --yes wrangler@3.109.0 secret put STRIPE_SECRET_KEY --name "$PREVIEW_WORKER_NAME" >/dev/null
          printf '%s' "$STRIPE_PUBLISHABLE_KEY" | npx --yes wrangler@3.109.0 secret put STRIPE_PUBLISHABLE_KEY --name "$PREVIEW_WORKER_NAME" >/dev/null
          if [ -n "${STRIPE_WEBHOOK_SECRET:-}" ]; then
            printf '%s' "$STRIPE_WEBHOOK_SECRET" | npx --yes wrangler@3.109.0 secret put STRIPE_WEBHOOK_SECRET --name "$PREVIEW_WORKER_NAME" >/dev/null
          fi
          echo "::notice::Stripe test keys added to the preview Worker. Test cards can now be used."
