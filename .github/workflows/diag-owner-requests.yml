# Read-only diagnostic: checks the live owner Enquiries list loads and MATNI-1060 is in it.
# Prints counts and statuses only (no customer names, emails or phones).
name: Diagnose owner requests list (read-only)
"on":
  push:
    branches: [claude/request-approve-email]
    paths: [.github/workflows/diag-owner-requests.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Load live booking jobs
        env:
          KEY: ${{ secrets.OWNER_ACCESS_KEY }}
        run: |
          BASE=https://reimagined-octo-meme.cgr28.workers.dev
          for H in X-Driver-Key X-Owner-Key; do
            echo "== header $H"
            curl -sS -o jobs.json -w "http=%{http_code} time=%{time_total}s size=%{size_download}\n" -H "$H: $KEY" -H "Accept: application/json" "$BASE/booking-jobs" || true
            python3 - <<'PY'
          import json,collections
          try:
              d=json.load(open("jobs.json"))
          except Exception as e:
              print("not json:", open("jobs.json").read()[:300]); raise SystemExit
          if "jobs" not in d:
              print("error body:", json.dumps(d)[:300]); raise SystemExit
          jobs=d["jobs"]
          print("jobs:",len(jobs))
          print("by status:",dict(collections.Counter(j.get("status") for j in jobs)))
          print("by kind:",dict(collections.Counter(j.get("kind") or j.get("source") for j in jobs)))
          aw=[j for j in jobs if j.get("status")=="awaiting_payment"]
          aw.sort(key=lambda j:j.get("createdAt",""),reverse=True)
          print("awaiting_payment newest 15 (ref, created, trip, quoteSent):")
          for j in aw[:15]:
              print(" ",j.get("bookingReference"),j.get("createdAt"),j.get("tripDate"),bool(j.get("sentQuoteAt")))
          m=[j for j in jobs if j.get("bookingReference")=="MATNI-1060"]
          print("MATNI-1060 present:",bool(m), {k:m[0].get(k) for k in ("status","kind","createdAt","tripDate")} if m else "")
          print("keys on a job:",sorted(jobs[0].keys()) if jobs else [])
          PY
          done
