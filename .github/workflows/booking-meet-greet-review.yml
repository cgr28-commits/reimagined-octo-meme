name: Optional Meet and Greet review
on:
  pull_request:
    branches: [main]
    paths:
      - 'shared/**'
      - 'src/components/QuoteCard.tsx'
      - 'src/app/booking-confirmed/**'
      - 'src/lib/create-payment.ts'
      - 'src/lib/booking-message.ts'
      - 'workers/addresses/**'
      - 'scripts/check-booking-meet-greet*'
      - '.github/workflows/booking-meet-greet-review.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_ADDRESSES_API_URL: http://127.0.0.1:8787/addresses
      NEXT_PUBLIC_BOOKINGS_API_URL: http://127.0.0.1:8787/bookings
      NEXT_TELEMETRY_DISABLED: '1'
      GITHUB_PAGES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix workers/addresses
      - run: node scripts/sync-worker-shared.mjs
      - name: Service, checkout and notification regressions
        run: |
          set -e
          for suite in booking-meet-greet-payment meet-greet meet-greet-email-upgrade bfs-minimum-only bfs-minimum-payment deposit-cash express-drop-off customer-confirm-email owner-email-bcc driver-whatsapp-voice add-driver quote-checkout-page pricing-vehicle-quote-flow open-website-payment-fares pricing-confirmation quote-authoritative-fare; do
            node --import tsx "scripts/check-$suite.ts"
          done
      - run: npm run lint
      - run: npm --prefix workers/addresses run build
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium webkit
      - name: Mobile and desktop service selection and payment summary
        run: |
          status=0
          for engine in chromium webkit; do
            PLAYWRIGHT_BROWSER=$engine node --import tsx scripts/check-booking-meet-greet-browser.mjs || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-meet-greet-review
          path: test-results/booking-meet-greet/
          if-no-files-found: warn
