name: Publish event fares preview
on:
  push:
    branches: [preview/event-fare-quote-service]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PREVIEW_API: https://matni-event-fares-review.cgr28.workers.dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix workers/addresses ci
          node scripts/sync-worker-shared.mjs
      - name: Build and test event pricing
        run: |
          npm run -s check:special-date-fares
          npm run -s check:belfast-events
          cd workers/addresses
          ./node_modules/.bin/wrangler deploy --config wrangler.event-quote-review.toml --dry-run
      - name: Publish dedicated read-only pricing service
        working-directory: workers/addresses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler deploy --config wrangler.event-quote-review.toml
      - name: Check published calendar and fare rules
        run: |
          set -euo pipefail
          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$PREVIEW_API/pricing/public" | python3 -c 'import json,sys; assert json.load(sys.stdin)["config"]["eventVenuePickups"]'
      - name: Build website using the dedicated pricing service
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BOOKINGS_API_URL: https://matni-event-fares-review.cgr28.workers.dev/bookings
          NEXT_PUBLIC_ADDRESSES_API_URL: https://matni-event-fares-review.cgr28.workers.dev/addresses
        run: |
          npm run build
          node scripts/fix-github-pages-paths.mjs
          rm -f out/CNAME out/sitemap.xml
          printf 'User-agent: *\nDisallow: /\n' > out/robots.txt
      - name: Publish this branch to the existing Pages preview project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          workers/addresses/node_modules/.bin/wrangler pages deploy out --project-name=my-airport-taxi-ni-preview --branch=event-fares-review --commit-hash="$GITHUB_SHA" --commit-dirty=true
