name: WhatsApp assistant review
on:
  pull_request:
    branches: [main]
    paths:
      - 'shared/**'
      - 'src/**'
      - 'workers/addresses/**'
      - 'scripts/check-whatsapp-*.ts'
      - 'scripts/check-customer-account.ts'
      - 'scripts/check-owner-inbox.ts'
      - 'scripts/check-google-ads-offline-feed.ts'
      - 'scripts/check-google-ads-spend.ts'
      - 'scripts/check-google-review-count.ts'
      - 'scripts/generate-whatsapp-knowledge.ts'
      - '.github/workflows/whatsapp-assistant-review.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix workers/addresses
      - run: node scripts/sync-worker-shared.mjs
      # The assistant answers from the website's FAQs/terms; regenerate after editing them.
      - run: node --import tsx scripts/generate-whatsapp-knowledge.ts --check
      - run: node --import tsx scripts/check-whatsapp-quote-bot.ts
      - run: node --import tsx scripts/check-whatsapp-templates.ts
      - run: node --import tsx scripts/check-whatsapp-pickup-info.ts
      - run: node --import tsx scripts/check-whatsapp-driver-contact.ts
      - run: node --import tsx scripts/check-quick-quote-reschedule.ts
      - run: node --import tsx scripts/check-marketing-campaign.ts
      - run: node --import tsx scripts/check-customer-account.ts
      - run: node --import tsx scripts/check-owner-inbox.ts
      - run: node --import tsx scripts/check-google-ads-offline-feed.ts
      - run: node --import tsx scripts/check-google-ads-spend.ts
      - run: node --import tsx scripts/check-google-review-count.ts
      - run: node --import tsx scripts/check-whatsapp-chat-log.ts
      - run: node --import tsx scripts/check-whatsapp-follow-up.ts
      - run: npm --prefix workers/addresses run typecheck
