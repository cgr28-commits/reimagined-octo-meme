name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Cancel stuck/queued deploys so a new push is not blocked behind
  # GitHub Pages "deployment_queued" timeouts.
  cancel-in-progress: true

jobs:
  # Only the deploy job should use the github-pages environment.
  # Putting it on build creates an extra environment deployment and can
  # leave GitHub Pages stuck in deployment_queued / in_progress.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so sitemap lastmod uses real git dates, not a shallow tip.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build site
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GETADDRESS_DOMAIN_TOKEN: ${{ secrets.GETADDRESS_DOMAIN_TOKEN }}
          BOOKINGS_API_URL: ${{ secrets.BOOKINGS_API_URL }}
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          GOOGLE_ADS_ID: ${{ secrets.GOOGLE_ADS_ID }}
          GOOGLE_ADS_QUOTE_CONVERSION_LABEL: ${{ secrets.GOOGLE_ADS_QUOTE_CONVERSION_LABEL }}
          GOOGLE_ADS_BOOKING_REQUEST_CONVERSION_LABEL: ${{ secrets.GOOGLE_ADS_BOOKING_REQUEST_CONVERSION_LABEL }}
          GOOGLE_ADS_PURCHASE_CONVERSION_LABEL: ${{ secrets.GOOGLE_ADS_PURCHASE_CONVERSION_LABEL }}
          GOOGLE_ADS_BOOKING_CONVERSION_LABEL: ${{ secrets.GOOGLE_ADS_BOOKING_CONVERSION_LABEL }}
          GOOGLE_ADS_WHATSAPP_CLICK_CONVERSION_LABEL: ${{ secrets.GOOGLE_ADS_WHATSAPP_CLICK_CONVERSION_LABEL }}
          GOOGLE_ADS_PHONE_CLICK_CONVERSION_LABEL: ${{ secrets.GOOGLE_ADS_PHONE_CLICK_CONVERSION_LABEL }}
        run: |
          KEY="${GOOGLE_PLACES_API_KEY:-${GOOGLE_API_KEY:-${GOOGLE_MAPS_API_KEY}}}"
          if [ -z "$KEY" ]; then
            echo "::warning::No Google API key secret found. Add GOOGLE_PLACES_API_KEY under Settings → Secrets and variables → Actions (repository or github-pages environment)."
          else
            echo "Google API key configured (${#KEY} characters)"
          fi
          if [ -n "$GETADDRESS_DOMAIN_TOKEN" ]; then
            echo "Legacy getAddress domain token configured (${#GETADDRESS_DOMAIN_TOKEN} characters)"
          else
            echo "::notice::Postcode premises lists use Ideal Postcodes on the Worker (IDEAL_POSTCODES_API_KEY). Google Places still powers free-text search."
          fi
          if [ -z "$BOOKINGS_API_URL" ]; then
            BOOKINGS_API_URL="https://reimagined-octo-meme.cgr28.workers.dev/bookings"
            echo "Using default BOOKINGS_API_URL ($BOOKINGS_API_URL)"
          elif [[ "$BOOKINGS_API_URL" == *"myairporttaxini.co.uk"* ]]; then
            echo "::warning::BOOKINGS_API_URL points at the static website and will be ignored. Using the Cloudflare Worker URL instead."
            BOOKINGS_API_URL="https://reimagined-octo-meme.cgr28.workers.dev/bookings"
          fi
          ADDRESSES_API_URL="${BOOKINGS_API_URL%/bookings}/addresses"
          echo "Using ADDRESSES_API_URL ($ADDRESSES_API_URL)"
          # Secrets optional — src/lib/google-ads.ts has account defaults for tag + quote_generated.
          # Lead/purchase labels stay optional until their distinct Ads actions are verified.
          export NEXT_PUBLIC_GOOGLE_PLACES_API_KEY="$KEY"
          export NEXT_PUBLIC_GETADDRESS_API_KEY="$GETADDRESS_DOMAIN_TOKEN"
          export NEXT_PUBLIC_BOOKINGS_API_URL="$BOOKINGS_API_URL"
          export NEXT_PUBLIC_ADDRESSES_API_URL="$ADDRESSES_API_URL"
          export NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY="$WEB3FORMS_ACCESS_KEY"
          export NEXT_PUBLIC_GOOGLE_ADS_ID="$GOOGLE_ADS_ID"
          export NEXT_PUBLIC_GOOGLE_ADS_QUOTE_CONVERSION_LABEL="$GOOGLE_ADS_QUOTE_CONVERSION_LABEL"
          export NEXT_PUBLIC_GOOGLE_ADS_BOOKING_REQUEST_CONVERSION_LABEL="$GOOGLE_ADS_BOOKING_REQUEST_CONVERSION_LABEL"
          export NEXT_PUBLIC_GOOGLE_ADS_PURCHASE_CONVERSION_LABEL="$GOOGLE_ADS_PURCHASE_CONVERSION_LABEL"
          export NEXT_PUBLIC_GOOGLE_ADS_BOOKING_CONVERSION_LABEL="$GOOGLE_ADS_BOOKING_CONVERSION_LABEL"
          export NEXT_PUBLIC_GOOGLE_ADS_WHATSAPP_CLICK_CONVERSION_LABEL="$GOOGLE_ADS_WHATSAPP_CLICK_CONVERSION_LABEL"
          export NEXT_PUBLIC_GOOGLE_ADS_PHONE_CLICK_CONVERSION_LABEL="$GOOGLE_ADS_PHONE_CLICK_CONVERSION_LABEL"
          export GITHUB_PAGES=true
          # The build downloads the site font from Google; that download occasionally fails
          # and used to fail the whole deploy. Retry up to three times before giving up.
          for attempt in 1 2 3; do
            if npm run build; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::Build failed after 3 attempts"; exit 1; fi
            echo "::warning::Build attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          if [ -n "$GOOGLE_ADS_PURCHASE_CONVERSION_LABEL" ] || [ -n "$GOOGLE_ADS_BOOKING_CONVERSION_LABEL" ]; then
            echo "Google Ads purchase conversion label override configured"
          else
            echo "::notice::No Google Ads purchase label — purchase remains available via dataLayer for GTM/GA4."
          fi
      - run: node scripts/fix-github-pages-paths.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
