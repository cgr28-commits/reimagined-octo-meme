name: Restore production worker email

# Deploys this branch's worker so booking email works again after test deploys.
on:
  push:
    branches:
      - "cursor/owner-driver-details-514b"
    paths:
      - "workers/addresses/**"
      - "shared/business-email.ts"
      - "shared/email-delivery.ts"
      - ".github/workflows/restore-worker-email.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/addresses/package-lock.json

      - name: Sync shared + build + deploy
        working-directory: workers/addresses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing Cloudflare credentials"
            exit 1
          fi
          npm ci
          npm run build
          npx wrangler deploy
          # Clear one-shot test token left by earlier email experiments
          printf 'cleared' | npx wrangler secret put TEST_EMAIL_TOKEN || true

      - name: Verify booking email path
        run: |
          sleep 8
          RESPONSE=$(curl -sS -X POST \
            "https://reimagined-octo-meme.cgr28.workers.dev/bookings" \
            -H "Content-Type: application/json" \
            -H "Origin: https://www.myairporttaxini.co.uk" \
            -d '{"customerName":"Email Restore Check","message":"[RESTORE CHECK] Ignore — verifying bookings@ email delivery is working again after provider order fix.","sendEmail":true}')
          echo "$RESPONSE"
          echo "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const j=JSON.parse(s); if(j.error){console.error(j); process.exit(1)} console.log("booking email ok", j)})'
