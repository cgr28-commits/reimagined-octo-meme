name: Homepage booking review
on:
  pull_request:
    paths:
      - 'src/components/HomepageQuoteFields.tsx'
      - 'src/components/QuoteCard.tsx'
      - 'scripts/check-homepage-booking-browser.mjs'
      - '.github/workflows/homepage-booking-review.yml'
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: GITHUB_PAGES=true npm run build
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Test homepage and booking on mobile and desktop
        run: |
          python3 -m http.server 3000 --directory out &
          node --import tsx scripts/check-homepage-booking-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-booking-review
          path: test-results/homepage-booking/
