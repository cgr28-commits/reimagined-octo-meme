name: Fetch golf hero image
on:
  push:
    branches: [golf-transfers]
    paths:
      - 'scripts/fetch-golf-hero.mjs'
      - '.github/workflows/fetch-golf-hero.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save sharp@0.33.5
      - run: node scripts/fetch-golf-hero.mjs
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/hero/royal-portrush.jpg public/images/hero/optimized/royal-portrush-* tmp-golf-candidates
          git diff --cached --quiet || git commit -m "Golf hero: Unsplash photo (Adam Montgomery) + review candidates"
          git push
