name: Fetch golf hero image
# One-off: downloads the CC BY 3.0 Royal Portrush photo from Wikimedia Commons,
# builds AVIF/WebP/JPEG variants and commits them to the branch it runs on.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save sharp@0.33.5
      - run: node scripts/fetch-golf-hero.mjs
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/hero/royal-portrush.jpg public/images/hero/optimized/royal-portrush-*
          git diff --cached --quiet || git commit -m "Add Royal Portrush hero images (Wikimedia Commons, CC BY 3.0)"
          git push
