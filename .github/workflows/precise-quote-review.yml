name: Precise locations and BFS minimum review
on:
  pull_request:
    branches: [main]
    paths:
      - 'shared/**'
      - 'src/**'
      - 'workers/addresses/**'
      - 'scripts/check-bfs-minimum-and-precise-places.ts'
      - 'scripts/check-precise-places-browser.mjs'
      - '.github/workflows/precise-quote-review.yml'
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_ADDRESSES_API_URL: http://127.0.0.1:8787/addresses
      NEXT_PUBLIC_BOOKINGS_API_URL: http://127.0.0.1:8787/bookings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix workers/addresses
      - run: node scripts/sync-worker-shared.mjs
      - run: node --import tsx scripts/check-bfs-minimum-and-precise-places.ts
      - run: node --import tsx scripts/check-quote-receipt.ts
      - run: npm --prefix workers/addresses run build
      - run: GITHUB_PAGES=true npm run build
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium webkit
      - run: node --import tsx scripts/check-precise-places-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precise-places-browser-results
          path: test-results/precise-places/
