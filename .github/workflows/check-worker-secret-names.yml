# One-off, read-only: lists the live Worker's secret NAMES (never values).
name: Check Worker secret names
"on":
  push:
    branches: [claude/check-worker-secrets]
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: List secret names
        working-directory: workers/addresses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 secret list --name reimagined-octo-meme | grep -o '"name": *"[^"]*"' | sed 's/"name": *//'
