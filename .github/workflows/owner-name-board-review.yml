name: Owner name board review
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/NameBoardPanel.tsx'
      - 'src/components/NameBoardPanel.module.css'
      - 'src/components/OwnerDashboardToolSwitcher.tsx'
      - 'src/lib/name-board.ts'
      - 'src/app/driver/**'
      - 'public/name-board-emblem-*.png'
      - 'scripts/check-owner-name-board*.ts'
      - 'scripts/name-board-harness/**'
      - '.github/workflows/owner-name-board-review.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Name board logic, privacy, access and regression checks
        run: npx tsx scripts/check-owner-name-board.ts
      - name: Existing owner / driver portal checks
        run: |
          npx tsx scripts/check-owner-dashboard-layout.ts
          npx tsx scripts/check-driver-portal-permissions.ts
          npx tsx scripts/check-driver-portal-access.ts
          npx tsx scripts/check-assigned-driver-jobs.ts
          npx tsx scripts/check-owner-job-nav-links.ts
          npx tsx scripts/check-owner-dashboard-today-sections.ts
          npx tsx scripts/check-owner-dashboard-job-cleanup.ts
          npx tsx scripts/check-journey-tracking.ts
          npx tsx scripts/check-booking-funnel.ts
          npx tsx scripts/check-quote-checkout-page.ts
          npx tsx scripts/check-saved-quote.ts
          npx tsx scripts/check-conversion-tracking.ts
          npx tsx scripts/check-paid-booking-ads-conversion.ts
          npx tsx scripts/check-whatsapp-templates.ts
          npx tsx scripts/check-owner-pricing.ts
      - name: Browser checks (iPhone layouts, long names, privacy, offline)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          npx tsx scripts/check-owner-name-board-browser.ts
      - name: Static export build (typecheck + lint as in production)
        run: GITHUB_PAGES=true npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: name-board-screenshots
          path: test-results/name-board/
          if-no-files-found: ignore
