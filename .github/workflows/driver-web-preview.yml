name: Isolated secure My Jobs staging
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/app/driver/**'
      - 'shared/driver-portal-access.ts'
      - 'shared/live-gps.ts'
      - 'shared/tracking.ts'
      - 'shared/customer-tracking-email.ts'
      - 'src/lib/data.ts'
      - 'src/app/track/**'
      - 'scripts/check-gps-disabled.ts'
      - 'workers/addresses/src/**'
      - 'scripts/driver-integration/**'
      - 'scripts/check-driver-integration*'
      - 'scripts/*driver-staging*'
      - 'scripts/check-driver-auth-expiry.ts'
      - 'scripts/seed-driver-staging.ts'
      - 'scripts/prepare-driver-integration.mjs'
      - 'src/lib/tracking-api.ts'
      - 'src/app/layout.tsx'
      - 'src/components/PublicWebsiteOnly.tsx'
      - 'src/components/PersonalFlightStatus.tsx'
      - 'scripts/prepare-driver-preview.mjs'
      - 'scripts/check-driver-preview-browser.mjs'
      - '.github/workflows/driver-web-preview.yml'
permissions:
  contents: read
concurrency:
  group: driver-web-preview-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.head_ref == 'codex/driver-web-dashboard' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix workers/addresses ci
      - run: npm --prefix workers/addresses run typecheck
      - run: node --import tsx scripts/check-driver-integration.ts
      - run: node --import tsx scripts/check-driver-auth-expiry.ts
      - run: node --import tsx scripts/check-gps-disabled.ts
      - run: node --import tsx scripts/check-driver-portal-permissions.ts
      - run: node --import tsx scripts/check-driver-whatsapp-voice.ts
      - name: Build with no backend or service credentials
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_MY_JOBS_INTEGRATION_PREVIEW: 'true'
          NEXT_PUBLIC_DRIVER_COOKIE_AUTH: 'true'
          NEXT_PUBLIC_BOOKINGS_API_URL: https://preview.invalid/bookings
          NEXT_PUBLIC_ADDRESSES_API_URL: https://preview.invalid/addresses
      - run: npm install --no-save --package-lock=false playwright@1.58.2 wrangler@4.151.3
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/prepare-secure-driver-staging.mjs
      - name: Verify iPhone-size preview and network isolation
        run: node --import tsx scripts/check-secure-driver-staging.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-jobs-preview
          path: |
            artifacts/driver-secure-staging
      - name: Provision and deploy isolated staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/configure-driver-staging.mjs
          node --import tsx scripts/seed-driver-staging.ts
          npx wrangler deploy --config wrangler.driver-staging.generated.json
