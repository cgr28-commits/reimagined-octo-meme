name: Isolated My Jobs preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/app/driver/**'
      - 'src/components/PersonalFlightStatus.tsx'
      - 'scripts/prepare-driver-preview.mjs'
      - 'scripts/check-driver-preview-browser.mjs'
      - '.github/workflows/driver-web-preview.yml'
permissions:
  contents: read
concurrency:
  group: driver-web-preview-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.head_ref == 'codex/driver-web-dashboard' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build with no backend or service credentials
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_MY_JOBS_PREVIEW: 'true'
          NEXT_PUBLIC_BOOKINGS_API_URL: https://preview.invalid/bookings
          NEXT_PUBLIC_ADDRESSES_API_URL: https://preview.invalid/addresses
      - run: node scripts/prepare-driver-preview.mjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify iPhone-size preview and network isolation
        run: node scripts/check-driver-preview-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-jobs-preview
          path: |
            out
            artifacts/driver-preview
      - name: Deploy static files to existing preview project only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@3.109.0 pages deploy out --project-name=my-airport-taxi-ni-preview --branch=driver-jobs-sample --commit-hash="${{ github.event.pull_request.head.sha }}"
