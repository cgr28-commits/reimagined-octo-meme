name: Booking flow visual review
on:
  push:
    branches: ['review/booking-flow']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Mocked services only: no real bookings, emails or payments.
      NEXT_PUBLIC_BOOKINGS_API_URL: https://booking-review.test/bookings
      NEXT_PUBLIC_ADDRESSES_API_URL: https://booking-review.test/addresses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix workers/addresses
      - run: npm run sync:worker-shared
      - run: GITHUB_PAGES=true npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --import tsx scripts/review-booking-flow-browser.cjs
        continue-on-error: true
      - name: Publish screenshots to review-shots branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd test-results/booking-review
          git init -q -b review-shots
          git config user.name "booking-review-bot"
          git config user.email "booking-review-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Booking flow review screenshots ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" review-shots
