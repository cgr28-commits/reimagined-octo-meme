name: Find Your Driver review
on:
  pull_request:
    paths:
      - 'shared/driver-locator.ts'
      - 'workers/addresses/src/driver-locator.ts'
      - 'workers/addresses/src/index.ts'
      - 'workers/addresses/wrangler*.toml'
      - 'src/components/DriverLocator.tsx'
      - 'src/components/FindDriverMap.tsx'
      - 'src/components/NameBoardPanel.tsx'
      - 'src/lib/driver-locator-api.ts'
      - 'src/app/find-your-driver/**'
      - 'src/app/driver/**'
      - 'src/app/layout.tsx'
      - 'scripts/check-driver-locator*.ts'
      - 'scripts/locator-harness/**'
      - '.github/workflows/find-your-driver-review.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix workers/addresses
      - run: node scripts/sync-worker-shared.mjs
      - name: Shared copies in sync
        run: git diff --exit-code -- workers/addresses/shared
      - name: Locator rules, Worker routes, Durable Object (offline fakes)
        run: npx tsx scripts/check-driver-locator.ts
      - name: Name board + existing portal, booking and tracking checks
        run: |
          npx tsx scripts/check-owner-name-board.ts
          npx tsx scripts/check-driver-portal-access.ts
          npx tsx scripts/check-driver-portal-permissions.ts
          npx tsx scripts/check-assigned-driver-jobs.ts
          npx tsx scripts/check-journey-tracking.ts
          npx tsx scripts/check-journey-tip.ts
          npx tsx scripts/check-booking-funnel.ts
          npx tsx scripts/check-quote-checkout-page.ts
          npx tsx scripts/check-conversion-tracking.ts
          npx tsx scripts/check-paid-booking-ads-conversion.ts
          npx tsx scripts/check-google-ads-offline-feed.ts
          npx tsx scripts/check-whatsapp-templates.ts
          npx tsx scripts/check-saved-quote.ts
          npx tsx scripts/check-owner-pricing.ts
      - name: Worker typecheck + dry-run deploy (no deploy)
        run: npm --prefix workers/addresses run build
      - name: Static export build (typecheck + lint)
        run: GITHUB_PAGES=true npm run build
      - name: Browser checks (driver combined mode, customer page, real Leaflet + OSM rules)
        run: |
          npm install --no-save --no-package-lock playwright
          export LOCATOR_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          export NAME_BOARD_CHROME="$LOCATOR_CHROME"
          test -n "$LOCATOR_CHROME"
          npx tsx scripts/check-driver-locator-browser.ts
          npx tsx scripts/check-owner-name-board-browser.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: find-your-driver-screenshots
          path: test-results/find-your-driver/
          if-no-files-found: ignore
