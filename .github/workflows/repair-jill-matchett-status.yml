name: Repair Jill Matchett upcoming status

# One-shot ops repair: clear erroneous completed/refunded tracking markers on
# Jill Matchett’s Sunday 23 Aug 2026 11:30 job only. Does not merge other PRs.
on:
  workflow_dispatch:
  # Same-repo PR runs have Actions secrets — repair without waiting on Vercel merge.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/trigger-repair-jill-matchett.txt"
      - ".github/workflows/repair-jill-matchett-status.yml"
      - "scripts/repair-jill-matchett-upcoming.ts"
      - "shared/repair-erroneous-tracking-status.ts"
      - "scripts/check-repair-erroneous-tracking-status.ts"
  push:
    branches: [main]
    paths:
      - "scripts/trigger-repair-jill-matchett.txt"
      - ".github/workflows/repair-jill-matchett-status.yml"
      - "scripts/repair-jill-matchett-upcoming.ts"
      - "shared/repair-erroneous-tracking-status.ts"

concurrency:
  group: repair-jill-matchett-status
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit checks for repair planner
        run: npx --yes tsx scripts/check-repair-erroneous-tracking-status.ts

  repair:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inspect + repair Jill Matchett tracking status only
        env:
          OWNER_ACCESS_KEY: ${{ secrets.OWNER_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_BASE_URL: https://reimagined-octo-meme.cgr28.workers.dev
        run: |
          if [ -z "${OWNER_ACCESS_KEY:-}" ]; then
            echo "::error::OWNER_ACCESS_KEY secret is missing"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            export CLOUDFLARE_ACCOUNT_ID="36c5c88df4c1f0259413d555f2679f3c"
            echo "::notice::Using default CLOUDFLARE_ACCOUNT_ID from wrangler.toml"
          fi
          npx --yes tsx scripts/repair-jill-matchett-upcoming.ts
