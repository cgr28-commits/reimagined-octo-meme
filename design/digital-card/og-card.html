<!doctype html><html><head><style>
@font-face{font-family:M;src:url(manrope-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:M;src:url(manrope-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:M;src:url(manrope-latin-800-normal.woff2);font-weight:800}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:M;color:#fff;overflow:hidden;
background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(47,191,74,.22),transparent 70%),radial-gradient(ellipse 80% 70% at 50% 120%,#0c2a52,transparent 70%),#071c38;
display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.frame{position:absolute;inset:28px;border:2px solid rgba(47,191,74,.35);border-radius:36px}
.logo{width:820px;height:auto}
h1{margin-top:44px;font-size:52px;font-weight:800;letter-spacing:-.5px}
.sub{margin-top:14px;font-size:27px;font-weight:500;color:#c9d4e2}
.row{margin-top:36px;display:flex;gap:18px}
.chip{padding:12px 24px;border-radius:999px;font-size:24px;font-weight:700}
.g{background:#2fbf4a;color:#071c38}.o{border:2px solid rgba(255,255,255,.35)}
</style></head><body><div class="frame"></div>
<img class="logo" src="logo-wide.svg">
<h1>Belfast &amp; Dublin Airport Transfers</h1>
<p class="sub">Belfast International · Belfast City · Dublin Airport</p>
<div class="row"><span class="chip g">Get an instant quote</span><span class="chip o">028 9602 2952</span><span class="chip o">Fixed prices</span></div>
</body></html>
